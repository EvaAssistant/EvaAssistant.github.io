// ---------------------------------------------------------------------
// ВЕРСИЯ ДЛЯ САЙТА: все движения Евы упакованы в один файл eva_pack.bin
// (делает _dev_tools\pack_site_eva). Отдельных файлов анимаций на сайте нет.
// ---------------------------------------------------------------------
import { unzlibSync } from 'three/addons/libs/fflate.module.js';
const EVA_PACK = (async () => {
  const buf = new Uint8Array(await (await fetch('./eva_pack.bin')).arrayBuffer());
  if (new TextDecoder().decode(buf.subarray(0, 8)) !== 'EVAPACK1') throw new Error('eva_pack.bin: не тот файл');
  const all = unzlibSync(buf.subarray(8));
  const hl = new DataView(all.buffer, all.byteOffset).getUint32(0, true);
  const head = JSON.parse(new TextDecoder().decode(all.subarray(4, 4 + hl)));
  return { head, body: all.subarray(4 + hl), urls: {} };
})();
const packKey = (url) => decodeURIComponent(String(url).replace(/^\.\/vrma\//, ''));
const packF32 = (P, [at, len]) => new Float32Array(P.body.buffer.slice(P.body.byteOffset + at, P.body.byteOffset + at + len));
async function packAsset(url) {
  const P = await EVA_PACK, e = P.head.fbx[packKey(url)];
  if (!e) throw new Error('нет в пакете: ' + packKey(url));
  const objs = e.nodes.map((n) => { const o = new THREE.Object3D(); o.name = n[0];
    o.position.fromArray(n, 2); o.quaternion.fromArray(n, 5); o.scale.fromArray(n, 9); return o; });
  e.nodes.forEach((n, i) => { if (n[1] >= 0) objs[n[1]].add(objs[i]); });
  const root = objs[0];
  const K = { q: THREE.QuaternionKeyframeTrack, v: THREE.VectorKeyframeTrack, n: THREE.NumberKeyframeTrack };
  root.animations = e.anims.map((a) => new THREE.AnimationClip(a.name, a.d,
    a.tr.map((t) => new K[t.k](t.n, packF32(P, t.t), packF32(P, t.x)))));
  root.updateMatrixWorld(true);
  return root;
}
async function packURL(key) {
  const P = await EVA_PACK; key = packKey(key);
  if (!P.urls[key]) { const r = P.head.raw[key]; if (!r) throw new Error('нет в пакете: ' + key);
    P.urls[key] = URL.createObjectURL(new Blob([P.body.slice(r[0], r[0] + r[1])])); }
  return P.urls[key];
}

// Физика волос (Spring Bone). null = как в модели (VRoid: жёсткость ~0.8,

const HAIR = { stiffness: 0.45, dragForce: 0.3, gravityPower: 0.08 };

  fwd: 0.08,      // руки чуть вперёд
  elbow: 0.25,    // лёгкий сгиб локтей
  wrist: 0.12,    // кисти слегка внутрь
};

// --- поза 'hands_front' ---
const ARM_DOWN = 1.3;      // насколько опущены руки
const ELBOW_BEND = 0.9;    // изгиб локтей
const ARM_FORWARD = 0.3;   // руки чуть вперёд
const HANDS_IN = 0.1;     // кисти к центру

// --- поза 'crossed' (руки скрещены на груди) ---

  down: 1.25,       // насколько опущены плечи/руки (больше = локти ниже)
  fwdL: 0.55,       // левая рука вперёд (левая лежит сверху)

  roll: -1.0,       // куда уходят предплечья: к центру. Если руки разошлись В СТОРОНЫ - поставь +1.0

  crossX: 0.18,     // правая нога вперёд
  knee: -0.15,      // сгиб колена правой ноги
  foot: -0.30,      // носок правой ноги вниз
  standZ: 0.05,     // левая (опорная) нога чуть к центру

};

// Камера. SHOW_FRACTION: 1.0 = Ева в полный рост, 0.5 = по пояс, 0.35 = по грудь.
const CAM = { fov: 30, SHOW_FRACTION: 1.0, MARGIN: 1.12, Y_SHIFT: 0.0,
              HEADROOM: 0.25,   // запас над головой (доля роста) - для поднятых рук. Больше = Ева меньше
              FLOOR: 0.04 };    // запас под ногами (доля роста)

const MORPH_SPEED = 10.0;
const BLINK_SPEED = 30.0;

// Старые имена морфов (шлёт avatar3d.py) -> выражения VRM
const MORPH_MAP = {
  MTH_A: { expr: 'aa', scale: 1.0 },
  MTH_I: { expr: 'ih', scale: 1.0 },
  MTH_U: { expr: 'ou', scale: 1.0 },
  MTH_E: { expr: 'ee', scale: 1.0 },
  MTH_O: { expr: 'oh', scale: 1.0 },
  EYE_Close:   { expr: 'blink',      scale: 1.0 },
  EYE_Close_L: { expr: 'blinkLeft',  scale: 1.0 },
  EYE_Close_R: { expr: 'blinkRight', scale: 1.0 },
  ALL_Joy:       { expr: 'happy',     scale: 1.0 },
  ALL_Fun:       { expr: 'relaxed',   scale: 1.0 },
  ALL_Angry:     { expr: 'angry',     scale: 0.8 },
  ALL_Sorrow:    { expr: 'sad',       scale: 1.0 },
  ALL_Surprised: { expr: 'surprised', scale: 1.0 },
};

// =====================================================================
// СЦЕНА
// =====================================================================
const container = document.getElementById('container');
const scene = new THREE.Scene();
// СТУДИЯ (?studio=1): съёмка промо. Картинка рисуется в точном размере видео (по умолчанию 1080×1920,
// вертикаль), окно показывает её уменьшенной. Фон: stage - красивая сцена, green - зелёный (хромакей).
const _qst = new URLSearchParams(location.search);
// УРОВЕНЬ ГРАФИКИ (панель → Настройки → «Графика Евы»; приходит адресом ?gfx=...).
//   pr - чёткость (доля от плотности экрана), aa - сглаживание краёв, pro - «дорогой» свет/контур/тень,
//   calm/active - кадров в секунду в покое и в движении.
const GFX_LEVELS = {
  ultra:  { pr: 1.5,  aa: true,  pro: true,  calm: 30, active: 60 },
  high:   { pr: 1.0,  aa: true,  pro: true,  calm: 30, active: 45 },
  medium: { pr: 1.0,  aa: true,  pro: false, calm: 30, active: 40 },
  low:    { pr: 0.75, aa: false, pro: false, calm: 24, active: 30 },
};
const GFX = GFX_LEVELS[_qst.get('gfx')] ? _qst.get('gfx') : 'ultra';
const GFX_CFG = GFX_LEVELS[GFX];
console.log('Графика: ' + GFX);
const INTRO = _qst.has('intro');      // Ева ещё не «вошла»: прячем, пока окно не начнёт появление
const STUDIO = _qst.has('studio') ? { w: +(_qst.get('w') || 1080), h: +(_qst.get('h') || 1920),
                                     bg: _qst.get('bg') || 'stage', fps: 30 } : null;
const camera = new THREE.PerspectiveCamera(CAM.fov, STUDIO ? STUDIO.w / STUDIO.h : window.innerWidth / window.innerHeight, 0.01, 100);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: STUDIO ? true : GFX_CFG.aa,
                                          powerPreference: GFX === 'low' ? 'low-power' : 'default' });
if (STUDIO) {
  renderer.setPixelRatio(1);
  renderer.setSize(STUDIO.w, STUDIO.h, false);
  const fit = () => {                       // вписать картинку в окно, сохранив пропорции
    const k = Math.min(innerWidth / STUDIO.w, innerHeight / STUDIO.h);
    Object.assign(renderer.domElement.style, { width: STUDIO.w * k + 'px', height: STUDIO.h * k + 'px',
      position: 'absolute', left: (innerWidth - STUDIO.w * k) / 2 + 'px', top: (innerHeight - STUDIO.h * k) / 2 + 'px' });
  };
  fit(); addEventListener('resize', fit);
  document.body.style.background = '#000';
} else {
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, GFX_CFG.pr));   // 2 - слишком тяжело для прозрачного окна
}
renderer.setClearColor(STUDIO && STUDIO.bg === 'green' ? 0x00ff00 : 0x000000, STUDIO && STUDIO.bg === 'green' ? 1 : 0);
// LOOK: 'anime' - правильный свет для аниме-шейдера MToon (как в VRoid Studio/VSeeFace);
//       'old'   - прежний «киношный» (ACES), цвета выцветают. Для сравнения: ?look=old
// LOOK: 'pro' - «дорогой» вид (контровой свет, цветные тени, контур, свет с трёх сторон, мягкая контактная тень);
//       'anime' - прежний простой вид; 'old' - самый старый. Для сравнения: ?look=anime
const LOOK = new URLSearchParams(location.search).get('look') || (GFX_CFG.pro || STUDIO ? 'pro' : 'anime');
// свет и цвет вида «pro» (можно подкрутить; для проверки - через адрес: ?k=0.6&sat=1.2)
const _q = new URLSearchParams(location.search);
const LIGHT = {
  key: +(_q.get('k') || 0.58),          // основной свет (доля от π). Больше - светлее
  fill: +(_q.get('f') || 0.15),        // заполняющий слева
  back: +(_q.get('b') || 0.6),         // контровой сзади
  ambient: +(_q.get('a') || 0.13),     // общий свет. Больше - белёсее

// ---- здоровье окна: если видеокарта не подключилась или «отвалилась» - просим Python перезагрузить окно
(function gpuCheck() {
  try {
    const gl = renderer.getContext();
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const info = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
    console.log('Видеокарта: ' + info);
    if (/swiftshader|basic render|llvmpipe|software/i.test(info))
      console.log('[ОКНО] видеокарта не подключилась (программный режим) - нужен перезапуск окна');
  } catch (e) { console.log('Видеокарта: не удалось узнать (' + e + ')'); }
  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    console.log('[ОКНО] видеокарта потеряна - нужен перезапуск окна');
  });
})();
const _stalls = [];          // моменты сильных подвисаний кадров
let _stallReported = -999;

if (LOOK === 'old') {

  const fillLight = new THREE.DirectionalLight(0xaaccff, 0.6); fillLight.position.set(-2, 0.5, 1); scene.add(fillLight);

// =====================================================================
// «ДОРОГОЙ» ВИД (LOOK = 'pro'): настройки аниме-шейдера MToon поверх того, что выгрузил VRoid
// (у VRoid по умолчанию нет контрового света, у волос нет теней, контур почти невидим)
// =====================================================================
const PRO = {
  rim:      [+(_q.get('r') || 0.12), +(_q.get('r') || 0.12), +(_q.get('r') || 0.12) * 1.2],   // контровая обводка (слабая - иначе белёсо)
  rimPower: 5.5,                   // ширина обводки: меньше - шире
  rimMix:   0.8,                   // 0 - светится всегда, 1 - только там, где есть свет
  faceRim:  0.35,                  // на лице обводка слабее (доля)
  hairShade:  [0.72, 0.60, 0.68],  // цвет тени на волосах (тёплый сиреневый, как в аниме)
  clothShade: [0.74, 0.78, 0.90],  // цвет тени на одежде (холодный - видно складки на белом)
  skinShade:  [0.97, 0.78, 0.82],  // тень на коже
  outline:  0.0015,                // толщина контура (метры), было 0.0008
  outlineColor: 0x2a1418,
};
function applyProLook(v) {
  if (LOOK !== 'pro') return;
  let n = 0;
  v.scene.traverse((o) => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) {
      if (!m || !m.isMToonMaterial) continue;
      const name = m.name || '';
      const face = /FACE|EYE/.test(name);
      if (m.parametricRimColorFactor) {
        const k = /SKIN/.test(name) && /Face/.test(name) ? PRO.faceRim : face ? 0 : /HAIR/.test(name) ? 0.7 : 1;
        m.parametricRimColorFactor.setRGB(PRO.rim[0] * k, PRO.rim[1] * k, PRO.rim[2] * k);
        m.parametricRimFresnelPowerFactor = PRO.rimPower;
        m.parametricRimLiftFactor = 0;
        m.rimLightingMixFactor = PRO.rimMix;
      }
      if (m.shadeColorFactor && !face) {
        const c = /HAIR/.test(name) ? PRO.hairShade : /CLOTH/.test(name) ? PRO.clothShade : /SKIN/.test(name) ? PRO.skinShade : null;
        if (c) m.shadeColorFactor.setRGB(c[0], c[1], c[2]);
        if (/HAIR/.test(name)) { m.shadingShiftFactor = -0.05; m.shadingToonyFactor = 0.88; }
      }
      if (m.outlineWidthMode === 'worldCoordinates' && m.outlineWidthFactor > 0) {
        m.outlineWidthFactor = PRO.outline;
        m.outlineColorFactor && m.outlineColorFactor.setHex(PRO.outlineColor);
        m.outlineLightingMixFactor = 0.6;
      }
      n++;
    }
  });
  console.log('Вид «pro»: настроено материалов ' + n);
}

// ---- мягкая контактная тень под ногами (настоящая форма ног и тела, размытая)
const CONTACT = { w: 1.1, d: 0.8, height: 0.55, res: 256, blur: 3.0, darkness: 3.0, opacity: 0.9 };

      'gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );',
      'gl_FragColor = vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * darkness );');

    uniforms: { tDiffuse: { value: null }, d: { value: new THREE.Vector2() } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 d; varying vec2 vUv;
      void main(){ vec4 s = vec4(0.0);
        s += texture2D(tDiffuse, vUv - 4.0*d) * 0.051; s += texture2D(tDiffuse, vUv - 3.0*d) * 0.0918;
        s += texture2D(tDiffuse, vUv - 2.0*d) * 0.12245; s += texture2D(tDiffuse, vUv - d) * 0.1531;
        s += texture2D(tDiffuse, vUv) * 0.1633;
        s += texture2D(tDiffuse, vUv + d) * 0.1531; s += texture2D(tDiffuse, vUv + 2.0*d) * 0.12245;
        s += texture2D(tDiffuse, vUv + 3.0*d) * 0.0918; s += texture2D(tDiffuse, vUv + 4.0*d) * 0.051;

    depthTest: false, depthWrite: false });

}
function blurContact(amount) {
  const q = contact.quad, px = amount / CONTACT.res;
  q.material = contact.blurH; contact.blurH.uniforms.tDiffuse.value = contact.rt.texture; contact.blurH.uniforms.d.value.set(px, 0);
  renderer.setRenderTarget(contact.rtBlur); renderer.render(contact.quadScene, contact.quadCam);
  q.material = contact.blurV; contact.blurV.uniforms.tDiffuse.value = contact.rtBlur.texture; contact.blurV.uniforms.d.value.set(0, px);

}
function updateContactShadow() {
  if (!contact.ready || !vrm) return;
  const hips = vrm.humanoid.getNormalizedBoneNode('hips').getWorldPosition(new THREE.Vector3());
  contact.group.position.set(hips.x, vrm.scene.position.y + 0.002, hips.z);

function setupCamera() {
  const box = new THREE.Box3().setFromObject(vrm.scene);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const shownH = size.y * CAM.SHOW_FRACTION;
  let centerY = box.max.y - shownH / 2 + size.y * CAM.Y_SHIFT;
  let visibleH = shownH * CAM.MARGIN;
  if (CAM.SHOW_FRACTION >= 1) {
    // в полный рост: ноги у нижнего края, сверху место для рук
    visibleH = size.y * (1 + CAM.FLOOR + CAM.HEADROOM);
    centerY = box.min.y - size.y * CAM.FLOOR + visibleH / 2 + size.y * CAM.Y_SHIFT;
  }
  const dist = (visibleH / 2) / Math.tan(THREE.MathUtils.degToRad(CAM.fov / 2));

  // Ева не по центру окна: слева от неё место для портала (?ex=0.6 - центр Евы на 60% ширины)
  const ex = +(_qst.get('ex') || 0.5);
  const camX = center.x - (ex - 0.5) * innerWidth * (visibleH / innerHeight);
  camera.position.set(camX, centerY, center.z + dist);
  camera.lookAt(camX, centerY, center.z);
}

              (HAIR ? ' (настройки HAIR применены)' : ' (настройки модели)'));
}

// ПОЗА ОЖИДАНИЯ КАК АНИМАЦИЯ (дыхание, покачивание, наклон головы)
// =====================================================================
function buildIdleClip() {
  const DUR = 20, STEP = 0.25, N = Math.round(DUR / STEP);
  const w = (k) => 2 * Math.PI * k / DUR; // k целое -> цикл без шва

  const sway = (k, amp) => (t) => Math.sin(w(k) * t) * amp;
  const tilt = POSE === 'crossed' ? LEGS.hipTilt : 0;
  const common = {
    hips:  (t) => [0, Math.sin(w(1) * t) * 0.03, tilt + Math.sin(w(2) * t) * 0.012],
    spine: (t) => [0, Math.sin(w(2) * t) * 0.01, -tilt * 0.6],
    chest: (t) => [Math.sin(w(5) * t) * 0.015, 0, 0],
    head:  (t) => [Math.sin(w(1) * t) * 0.02, Math.sin(w(2) * t) * 0.04, 0.04 + Math.sin(w(1) * t + 1) * 0.02],
  };
  const legs = {
    leftUpperLeg:  (t) => [0, 0, LEGS.standZ],
    rightUpperLeg: (t) => [LEGS.crossX, 0, LEGS.crossZ],
    leftLowerLeg:  (t) => [0, 0, 0],
    rightLowerLeg: (t) => [LEGS.knee, 0, 0],
    rightFoot:     (t) => [LEGS.foot, 0, 0],
  };
  const armsFront = {
    leftShoulder:  (t) => [0, 0, 0.08],
    rightShoulder: (t) => [0, 0, -0.08],
    leftUpperArm:  (t) => [0, -ARM_FORWARD,  ARM_DOWN + sway(3, 0.015)(t)],
    rightUpperArm: (t) => [0,  ARM_FORWARD, -ARM_DOWN - sway(3, 0.015)(t)],
    leftLowerArm:  (t) => [0, -ELBOW_BEND, 0],
    rightLowerArm: (t) => [0,  ELBOW_BEND, 0],
    leftHand:      (t) => [0, 0,  HANDS_IN],
    rightHand:     (t) => [0, 0, -HANDS_IN],
  };
  const armsCrossed = {
    leftShoulder:  (t) => [0, 0, 0.05],
    rightShoulder: (t) => [0, 0, -0.05],
    leftUpperArm:  (t) => [0, -CROSS.fwdL,  CROSS.down + sway(3, 0.01)(t)],
    rightUpperArm: (t) => [0,  CROSS.fwdR, -CROSS.down - sway(3, 0.01)(t)],
    leftLowerArm:  (t) => [CROSS.roll, -CROSS.bendL, 0],
    rightLowerArm: (t) => [CROSS.roll,  CROSS.bendR, 0],
    leftHand:      (t) => [0, 0,  0.1],
    rightHand:     (t) => [0, 0, -0.1],
  };
  const armsRelaxed = {
    leftShoulder:  (t) => [0, 0, 0.04],
    rightShoulder: (t) => [0, 0, -0.04],
    leftUpperArm:  (t) => [0, -RELAX.fwd,  RELAX.down + sway(3, 0.02)(t)],
    rightUpperArm: (t) => [0,  RELAX.fwd, -RELAX.down - sway(3, 0.02)(t)],
    leftLowerArm:  (t) => [0, -RELAX.elbow - sway(4, 0.03)(t), 0],
    rightLowerArm: (t) => [0,  RELAX.elbow + sway(4, 0.03)(t), 0],
    leftHand:      (t) => [0, 0,  RELAX.wrist],
    rightHand:     (t) => [0, 0, -RELAX.wrist],
  };
  let pose;
  if (POSE === 'crossed') pose = { ...armsCrossed, ...legs, ...common };
  else if (POSE === 'relaxed') pose = { ...armsRelaxed, ...common };
  else pose = { ...armsFront, ...common };

  const times = [];
  for (let i = 0; i <= N; i++) times.push(i * STEP);

  const tracks = [];
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  for (const [bone, fn] of Object.entries(pose)) {
    const node = vrm.humanoid.getNormalizedBoneNode(bone);
    if (!node) continue;
    const values = [];
    for (const t of times) {
      const [x, y, z] = fn(t);
      e.set(x, y, z, 'XYZ');
      q.setFromEuler(e);
      values.push(q.x, q.y, q.z, q.w);
    }
    tracks.push(new THREE.QuaternionKeyframeTrack(node.name + '.quaternion', times, values));
  }
  return new THREE.AnimationClip('eva_idle', DUR, tracks);
}

const clipCache = {};
async function getClip(file) {
  if (file in clipCache) return clipCache[file];
  if (file.toLowerCase().endsWith('.fbx')) {
    try {
      clipCache[file] = lockInPlace(await loadMixamoClip(VRMA_FOLDER + file.split('/').map(encodeURIComponent).join('/')));
      console.log('Анимация Mixamo загружена: ' + file + ' (' + clipCache[file].duration.toFixed(1) + ' с)');
    } catch (e) {
      clipCache[file] = null;
      console.warn('Не удалось загрузить ' + file + ': ' + e);
    }
    return clipCache[file];
  }
  try {
    const gltf = await loader.loadAsync(await packURL(file));
    const anim = gltf.userData.vrmAnimations && gltf.userData.vrmAnimations[0];
    clipCache[file] = anim ? lockInPlace(createVRMAnimationClip(anim, vrm)) : null;
    if (clipCache[file]) console.log('Анимация загружена: ' + file);
  } catch (e) {
    clipCache[file] = null; // файла нет - это нормально
  }
  return clipCache[file];
}

// ---------------------------------------------------------------------
// Перенос анимации Mixamo (FBX) на скелет VRM
// (по официальному примеру three-vrm: loadMixamoAnimation)
// ---------------------------------------------------------------------
let vrmHipsHeight = 0.87;
let vrmHipsRest = null;

// Ева стоит на месте: убираем из анимации шаги вперёд/назад/в стороны
// (по X и Z), оставляем только движение вверх-вниз (приседания, дыхание).
const LOCK_IN_PLACE = true;
function lockInPlace(clip) {
  if (!LOCK_IN_PLACE || !clip || !vrmHipsRest) return clip;
  const name = vrm.humanoid.getNormalizedBoneNode('hips').name + '.position';
  for (const track of clip.tracks) {
    if (track.name !== name) continue;
    const v = track.values;
    for (let i = 0; i < v.length; i += 3) { v[i] = vrmHipsRest.x; v[i + 2] = vrmHipsRest.z; }
  }
  return clip;
}
const MIXAMO_TO_VRM = {
  Hips: 'hips', Spine: 'spine', Spine1: 'chest', Spine2: 'upperChest', Neck: 'neck', Head: 'head',
  LeftShoulder: 'leftShoulder', LeftArm: 'leftUpperArm', LeftForeArm: 'leftLowerArm', LeftHand: 'leftHand',
  RightShoulder: 'rightShoulder', RightArm: 'rightUpperArm', RightForeArm: 'rightLowerArm', RightHand: 'rightHand',
  LeftUpLeg: 'leftUpperLeg', LeftLeg: 'leftLowerLeg', LeftFoot: 'leftFoot', LeftToeBase: 'leftToes',
  RightUpLeg: 'rightUpperLeg', RightLeg: 'rightLowerLeg', RightFoot: 'rightFoot', RightToeBase: 'rightToes',
};
for (const side of ['Left', 'Right']) {
  const s = side.toLowerCase();
  MIXAMO_TO_VRM[side + 'HandThumb1'] = s + 'ThumbMetacarpal';
  MIXAMO_TO_VRM[side + 'HandThumb2'] = s + 'ThumbProximal';
  MIXAMO_TO_VRM[side + 'HandThumb3'] = s + 'ThumbDistal';
  for (const f of ['Index', 'Middle', 'Ring', 'Little']) {
    const mx = f === 'Little' ? 'Pinky' : f;
    MIXAMO_TO_VRM[side + 'Hand' + mx + '1'] = s + f + 'Proximal';
    MIXAMO_TO_VRM[side + 'Hand' + mx + '2'] = s + f + 'Intermediate';
    MIXAMO_TO_VRM[side + 'Hand' + mx + '3'] = s + f + 'Distal';
  }
}

// Ноги и таз из Mixamo на Еве «скользят» (другие пропорции тела), и кажется,
// что она висит в воздухе. Поэтому берём из Mixamo только верх тела,
// а ноги стоят твёрдо. false = брать всё тело.
const MIXAMO_UPPER_BODY_ONLY = true;
const LOWER_BODY = new Set(['hips', 'leftUpperLeg', 'leftLowerLeg', 'leftFoot', 'leftToes',
                            'rightUpperLeg', 'rightLowerLeg', 'rightFoot', 'rightToes']);

// Перенос веса с ноги на ногу (пока играет анимация Mixamo без ног).
// period - полный цикл «левая-правая» в секундах; shift - сдвиг таза в метрах;
// tilt - наклон таза; knee - сгиб колена свободной ноги. 0 в shift/tilt/knee = выключить.
const WEIGHT_SHIFT = { period: 14, shift: 0.02, tilt: 0.045, knee: 0.18, legLen: 0.8 };
let legBlend = 0;
const _qLeg = new THREE.Quaternion(), _eLeg = new THREE.Euler();

function setBoneRot(bone, x, y, z, w) {
  const node = vrm.humanoid.getNormalizedBoneNode(bone);
  if (!node) return;
  _qLeg.setFromEuler(_eLeg.set(x, y, z, 'XYZ'));
  node.quaternion.slerp(_qLeg, w);
}

// =====================================================================
// ПОДГОНКА MIXAMO ПОД ФИГУРУ ЕВЫ: манекен Mixamo худой, руки у него почти прижаты к телу.
// У Евы объёмная кофта - те же углы уводят руки в рукава и кофту, а плечи задираются.
// Поправка вшивается в анимацию ОДИН раз при загрузке (каждый кадр ничего не трогаем):
// ARM_SPREAD - отвести руки от тела (градусы), SHOULDER_KEEP - сколько оставить движения плеч (0..1).
// Для подбора можно открыть страницу с ?spread=12&shoulder=0.4
// =====================================================================
const _qs = new URLSearchParams(location.search);
const ARM_SPREAD = _qs.has('spread') ? Number(_qs.get('spread')) : 0;   // новой Еве поправка не нужна
const SHOULDER_KEEP = _qs.has('shoulder') ? Number(_qs.get('shoulder')) : 1;
function fitTrackToBody(vrmBone, values) {
  const side = vrmBone.startsWith('left') ? 1 : -1;
  const q = new THREE.Quaternion(), id = new THREE.Quaternion();
  if (vrmBone.endsWith('UpperArm') && ARM_SPREAD) {
    const R = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -side * THREE.MathUtils.degToRad(ARM_SPREAD))   // минус = наружу (проверено на снимках);
    for (let i = 0; i < values.length; i += 4) q.fromArray(values, i).premultiply(R).toArray(values, i);
  } else if (vrmBone.endsWith('Shoulder') && SHOULDER_KEEP < 1) {
    for (let i = 0; i < values.length; i += 4) q.fromArray(values, i).slerp(id, 1 - SHOULDER_KEEP).toArray(values, i);
  }
}

// =====================================================================
// ПЛОТНОСТЬ ТЕЛА: руки не проходят сквозь туловище.
// При загрузке тело Евы само измеряется по модели (сечения через каждые 3 см).
// Каждый кадр: если точка руки (локоть, предплечье, запястье, ладонь) внутри тела -
// плечо/локоть поворачиваются ровно настолько, чтобы рука легла на поверхность.
// Рука, которая тела не касается, не трогается. Поправка считается заново каждый кадр
// от позы из анимации - поэтому не накапливается.
// =====================================================================
const BODY_SOLID = true;
const ARM_RADIUS = { elbow: 0.032, fore: 0.03, wrist: 0.026, palm: 0.02 };   // толщина руки (м)
const bodyCol = { bands: null, step: 0.03, min: 0, frontSign: 1 };
const _bv = new THREE.Vector3(), _bw = new THREE.Vector3(), _bi = new THREE.Matrix4();

function buildBodyCollider() {
  const N = (n) => vrm.humanoid.getNormalizedBoneNode(n), R = (n) => vrm.humanoid.getRawBoneNode(n);
  const hipsN = N('hips');
  vrm.scene.updateMatrixWorld(true);
  _bi.copy(hipsN.matrixWorld).invert();                     // координаты «от бёдер»
  // где у тела перед: носок стопы впереди пятки
  const foot = R('leftFoot'), toes = R('leftToes');
  if (foot && toes) {
    const a = foot.getWorldPosition(new THREE.Vector3()).applyMatrix4(_bi);
    const b = toes.getWorldPosition(new THREE.Vector3()).applyMatrix4(_bi);
    bodyCol.frontSign = Math.sign(b.z - a.z) || 1;
  }
  const torso = new Set();
  for (const n of ['hips', 'spine', 'chest', 'upperChest']) { const b = R(n); if (b) torso.add(b); }
  const bands = {};
  vrm.scene.traverse((m) => {
    if (!m.isSkinnedMesh || /hair|face/i.test(m.name)) return;
    const g = m.geometry, si = g.attributes.skinIndex, sw = g.attributes.skinWeight, P = g.attributes.position;
    if (!si || !sw) return;
    for (let i = 0; i < P.count; i++) {
      let best = 0, bw = -1;
      for (let k = 0; k < 4; k++) { const w = sw.getComponent(i, k); if (w > bw) { bw = w; best = si.getComponent(i, k); } }
      if (!torso.has(m.skeleton.bones[best])) continue;     // только туловище (без рук, ног, головы)
      m.getVertexPosition(i, _bv); _bv.applyMatrix4(m.matrixWorld).applyMatrix4(_bi);
      const k = Math.round(_bv.y / bodyCol.step);
      const z = _bv.z * bodyCol.frontSign;
      const b = bands[k] || (bands[k] = { w: 0, f: 0, b: 0 });
      b.w = Math.max(b.w, Math.abs(_bv.x)); b.f = Math.max(b.f, z); b.b = Math.max(b.b, -z);
    }
  });
  const ks = Object.keys(bands).map(Number).sort((a, b) => a - b);
  if (!ks.length) { console.warn('Тело: не нашла туловище в модели'); return; }
  bodyCol.min = ks[0];
  bodyCol.bands = [];
  for (let k = ks[0]; k <= ks[ks.length - 1]; k++) {        // дырки между сечениями - берём соседей
    const b = bands[k] || bands[k - 1] || bands[k + 1] || { w: 0, f: 0, b: 0 };
    bodyCol.bands.push(b);
  }
  console.log('Тело измерено: ' + bodyCol.bands.length + ' сечений, ширина до ' +
    Math.max(...bodyCol.bands.map((b) => b.w)).toFixed(2) + ' м');
}

function bodyAt(y) {
  if (!bodyCol.bands) return null;
  const i = Math.round(y / bodyCol.step) - bodyCol.min;
  return i >= 0 && i < bodyCol.bands.length ? bodyCol.bands[i] : null;
}
// точка (координаты от бёдер) внутри тела? -> насколько и куда вытолкнуть (там же), иначе null
function bodyPushLocal(p, r) {
  const S = bodyAt(p.y);
  if (!S || S.w < 0.02) return null;
  const z = p.z * bodyCol.frontSign;
  const a = S.w + r, c = (z >= 0 ? S.f : S.b) + r;
  const k = Math.hypot(p.x / a, z / c);
  if (k >= 1) return null;
  const sx = k < 1e-4 ? Math.sign(p.x) || 1 : p.x / k, sz = k < 1e-4 ? 0 : z / k;
  return new THREE.Vector3(sx - p.x, 0, (sz - z) * bodyCol.frontSign);
}
// повернуть кость (её мировой поворот), чтобы её дочерняя точка from сдвинулась на push (всё в мире)
function turnBone(bone, from, push) {
  const j = bone.getWorldPosition(new THREE.Vector3());
  const v1 = from.clone().sub(j), v2 = from.clone().add(push).sub(j);
  if (v1.lengthSq() < 1e-8 || v2.lengthSq() < 1e-8) return;
  const R = new THREE.Quaternion().setFromUnitVectors(v1.normalize(), v2.normalize());
  const pq = bone.parent.getWorldQuaternion(new THREE.Quaternion());
  bone.quaternion.premultiply(pq.clone().invert().multiply(R).multiply(pq));
  bone.updateMatrixWorld(true);
}
const _solid = new Map();   // кость -> {anim: поза из анимации, out: что мы записали}
function keepAnimPose(bone) {
  // если анимация в этот кадр кость не переписала - начинаем от её позы, а не от нашей поправки
  const st = _solid.get(bone);
  if (st && bone.quaternion.equals(st.out)) bone.quaternion.copy(st.anim);
  _solid.set(bone, { anim: bone.quaternion.clone(), out: null });
}
function solidBody() {
  if (!BODY_SOLID || !bodyCol.bands) return;
  const N = (n) => vrm.humanoid.getNormalizedBoneNode(n);
  const hips = N('hips');
  for (const side of ['left', 'right']) {
    const up = N(side + 'UpperArm'), lo = N(side + 'LowerArm'), hand = N(side + 'Hand'), mid = N(side + 'MiddleProximal');
    if (!up || !lo || !hand) continue;
    keepAnimPose(up); keepAnimPose(lo);
  }
  vrm.humanoid.normalizedHumanBonesRoot.updateMatrixWorld(true);
  _bi.copy(hips.matrixWorld).invert();
  const toWorldDir = hips.getWorldQuaternion(new THREE.Quaternion());
  for (const side of ['left', 'right']) {
    const up = N(side + 'UpperArm'), lo = N(side + 'LowerArm'), hand = N(side + 'Hand'), mid = N(side + 'MiddleProximal');
    if (!up || !lo || !hand) continue;
    for (let it = 0; it < 4; it++) {
      const e = lo.getWorldPosition(new THREE.Vector3()), h = hand.getWorldPosition(new THREE.Vector3());
      const m = mid ? mid.getWorldPosition(new THREE.Vector3()) : h.clone();
      const pts = [[e, ARM_RADIUS.elbow, up], [e.clone().lerp(h, 0.5), ARM_RADIUS.fore, up],
                   [h, ARM_RADIUS.wrist, lo], [h.clone().lerp(m, 0.7), ARM_RADIUS.palm, lo]];
      let worst = null, wl = 0.002;                         // меньше 2 мм - не трогаем
      for (const [pw, r, bone] of pts) {
        const pl = pw.clone().applyMatrix4(_bi);
        const push = bodyPushLocal(pl, r);
        if (push && push.length() > wl) { wl = push.length(); worst = [pw, push.applyQuaternion(toWorldDir), bone]; }
      }
      if (!worst) break;
      turnBone(worst[2], worst[0], worst[1].multiplyScalar(1.05));
    }
    _solid.get(up).out = up.quaternion.clone();
    _solid.get(lo).out = lo.quaternion.clone();
  }
}

function updateWeightShift(dt) {
  const cur = shotAction ? shotAction.getClip() : baseClip;
  const usingMixamo = cur && cur.name.startsWith('mixamo_');
  const target = (MIXAMO_UPPER_BODY_ONLY && usingMixamo) ? 1 : 0;
  legBlend += (target - legBlend) * Math.min(1, dt * 3);
  if (legBlend < 0.001) return;

  const W = WEIGHT_SHIFT;
  const t = clock.elapsedTime;
  // s: -1..1, задерживается на каждой ноге и плавно переходит
  const s = Math.tanh(2.2 * Math.sin(2 * Math.PI * t / W.period)) / Math.tanh(2.2);
  const dx = W.shift * s;           // таз в сторону опорной ноги
  const roll = W.tilt * s;          // бедро опорной ноги чуть выше
  const legZ = -roll - dx / W.legLen; // ноги остаются вертикальными, ступни на месте
  const bendL = W.knee * Math.max(0, -s); // левая свободна, когда вес на правой
  const bendR = W.knee * Math.max(0, s);

  const hips = vrm.humanoid.getNormalizedBoneNode('hips');
  if (hips && vrmHipsRest) {
    hips.position.x += (vrmHipsRest.x + dx - hips.position.x) * legBlend;
    hips.position.y += (vrmHipsRest.y - 0.004 * Math.abs(s) - hips.position.y) * legBlend;
    hips.position.z += (vrmHipsRest.z - hips.position.z) * legBlend;
  }
  setBoneRot('hips', 0, 0.03 * s, roll, legBlend);
  setBoneRot('leftUpperLeg',  -0.5 * bendL, 0, legZ, legBlend);
  setBoneRot('rightUpperLeg', -0.5 * bendR, 0, legZ, legBlend);
  setBoneRot('leftLowerLeg',  bendL, 0, 0, legBlend);
  setBoneRot('rightLowerLeg', bendR, 0, 0, legBlend);
  setBoneRot('leftFoot',  -0.5 * bendL, 0, 0, legBlend);
  setBoneRot('rightFoot', -0.5 * bendR, 0, 0, legBlend);
}

const fbxLoader = new FBXLoader();
async function loadMixamoClip(url, opt = {}) {
  const asset = await packAsset(url);
  const clip = THREE.AnimationClip.findByName(asset.animations, 'mixamo.com') || asset.animations[0];
  if (!clip) throw new Error('в файле нет анимации');

  // Mixamo: mixamorigHips; Rokoko и другие мокап-студии: те же имена без приставки (Hips, Spine, LeftArm...)
  const hipsNode = asset.getObjectByName('mixamorigHips') || asset.getObjectByName('Hips');
  if (!hipsNode) throw new Error('не найден скелет (Hips / mixamorigHips)');
  const isMixamo = hipsNode.name.startsWith('mixamorig');
  // Мокап (Rokoko и др.): первый кадр - калибровочная T-поза. Берём её как исходную позу скелета
  // (у некоторых файлов «поза по умолчанию» кривая) и отрезаем T-позу в начале и в конце записи.
  let trim = null;
  if (!isMixamo) { trim = findMocapRange(asset, clip); poseAt(asset, clip, 0); }
  const hipsScale = vrmHipsHeight / (Math.abs(hipsNode.position.y) > 1e-3 ? hipsNode.position.y : 100);
  const isVRM0 = vrm.meta && vrm.meta.metaVersion === '0';

  const restInv = new THREE.Quaternion();
  const parentRest = new THREE.Quaternion();
  const q = new THREE.Quaternion();
  const tracks = [];

  for (const track of clip.tracks) {
    const [rigName, prop] = track.name.split('.');
    const vrmBone = MIXAMO_TO_VRM[rigName.replace(/^mixamorig\d*/, '')];
    const vrmNode = vrmBone && vrm.humanoid.getNormalizedBoneNode(vrmBone);
    const rigNode = asset.getObjectByName(rigName);
    if (!vrmNode || !rigNode) continue;
    if (MIXAMO_UPPER_BODY_ONLY && LOWER_BODY.has(vrmBone) && !opt.full) continue;   // ходьба/прыжок - всё тело

    rigNode.getWorldQuaternion(restInv).invert();
    rigNode.parent.getWorldQuaternion(parentRest);

    if (track instanceof THREE.QuaternionKeyframeTrack) {
      const v = track.values.slice();
      for (let i = 0; i < v.length; i += 4) {
        q.fromArray(v, i).premultiply(parentRest).multiply(restInv).toArray(v, i);
        if (isVRM0) { v[i] = -v[i]; v[i + 2] = -v[i + 2]; }
      }
      fitTrackToBody(vrmBone, v);
      tracks.push(new THREE.QuaternionKeyframeTrack(vrmNode.name + '.' + prop, track.times, v));
    } else if (track instanceof THREE.VectorKeyframeTrack && vrmBone === 'hips') {
      // Высота бёдер: первый кадр = рост бёдер Евы, дальше только изменения
      // (дыхание, приседания) в её масштабе. Так ноги всегда стоят на полу.
      const y0 = track.values[1];
      const sc = Math.abs(y0) > 1e-6 ? vrmHipsHeight / y0 : hipsScale;
      const baseY = vrmHipsRest ? vrmHipsRest.y : vrmHipsHeight;
      // opt.abs - высота бёдер «как есть» (лёжа, вися, в прыжке): пол Mixamo = пол Евы
      const v = opt.abs
        ? track.values.map((x, i) => (i % 3 === 1 ? x * hipsScale + (baseY - vrmHipsHeight) + (opt.yOff || 0) : (isVRM0 ? -x : x) * hipsScale))
        : track.values.map((x, i) => {
          if (i % 3 === 1) return baseY + (x - y0) * sc;
          return (isVRM0 ? -x : x) * sc;
        });
      console.log('Mixamo бёдра: узел ' + hipsNode.position.y.toFixed(2) + ', кадр0 ' + y0.toFixed(2) +
                  ', было бы ' + (y0 * hipsScale).toFixed(2) + ' м, стало ' + baseY.toFixed(2) + ' м');
      tracks.push(new THREE.VectorKeyframeTrack(vrmNode.name + '.' + prop, track.times, v));
    }
  }
  let out = new THREE.AnimationClip((opt.full ? 'mixamofull_' : 'mixamo_') + url, clip.duration, tracks);
  out.userData = { hipsScale };
  if (trim) out = trimClip(out, trim[0], trim[1]);
  const cut = Object.entries(CLIP_CUT).find(([k]) => url.endsWith(k.split('/').map(encodeURIComponent).join('/')));
  if (cut) {
    const [t0, t1] = cut[1];
    out = appendReturn(trimClip(out, t0, Math.min(t1, out.duration)), 0.7);
    console.log('Обрезано по настройке: ' + cut[0] + ' ' + t0 + '-' + t1 + ' с');
  }
  return opt.once ? out : makeLoopSeamless(out, LOOP_BLEND);
}

// Ручная обрезка: [с какой секунды, по какую] (секунды как в просмотрщике анимаций).
// После обрезки Ева плавно возвращается в начальную позу.
const CLIP_CUT = {
  'rokoko/Cheer.fbx': [0, 1.95],
  // смех: до 3,3 с - смеётся, запрокинув голову; дальше в файле резкий глубокий кивок
  // вперёд (60° за 0,4 с) и голова висит внизу до 5,9 с - выглядело ужасно, отрезано
  'anim/emotion/Laughing.fbx': [0, 3.3],
};

// плавный возврат в первую позу клипа за sec секунд
function appendReturn(clip, sec) {
  const D = clip.duration;
  const tracks = clip.tracks.map((tr) => {
    const n = tr.getValueSize(), k = tr.times.length;
    const times = new Float32Array(k + 1); times.set(tr.times); times[k] = D + sec;
    const vals = new Float32Array(tr.values.length + n); vals.set(tr.values);
    for (let i = 0; i < n; i++) vals[k * n + i] = tr.values[i];
    return new tr.constructor(tr.name, times, vals);
  });
  return new THREE.AnimationClip(clip.name, D + sec, tracks);
}

// поставить скелет FBX в позу кадра i
function poseAt(asset, clip, i) {
  for (const t of clip.tracks) {
    const [n, prop] = t.name.split('.');
    const o = asset.getObjectByName(n);
    if (!o || !(prop in o) || !o[prop].fromArray) continue;
    o[prop].fromArray(t.values, Math.min(i, t.times.length - 1) * t.getValueSize());
  }
  asset.updateMatrixWorld(true);
}

// где в мокап-записи настоящее движение: без T-позы (руки горизонтально в стороны) в начале и в конце
function findMocapRange(asset, clip) {
  const times = clip.tracks[0].times, n = times.length;
  const get = (nm) => asset.getObjectByName(nm);
  const LA = get('LeftArm'), LH = get('LeftHand'), RA = get('RightArm'), RH = get('RightHand');
  if (!LA || !LH || !RA || !RH || n < 10) return null;
  const a = new THREE.Vector3(), h = new THREE.Vector3();
  poseAt(asset, clip, 0);
  const armLen = LA.getWorldPosition(a).distanceTo(LH.getWorldPosition(h)) || 1;
  const side = (A, H) => {
    A.getWorldPosition(a); H.getWorldPosition(h);
    const dy = Math.abs(h.y - a.y), flat = Math.hypot(h.x - a.x, h.z - a.z);
    return dy < 0.35 * armLen && flat > 0.8 * armLen;           // рука вытянута горизонтально
  };
  const tpose = (i) => { poseAt(asset, clip, i); return side(LA, LH) && side(RA, RH); };
  let i0 = 0; while (i0 < n - 1 && tpose(i0)) i0++;
  let i1 = n - 1; while (i1 > i0 && tpose(i1)) i1--;
  const pad = 0.25;                                              // ещё чуть-чуть: руки опускаются из T-позы
  const t0 = i0 > 0 ? Math.min(times[i0] + pad, times[n - 1]) : times[0];
  const t1 = i1 < n - 1 ? Math.max(times[i1] - pad, t0 + 1) : times[n - 1];
  if (t1 - t0 < 1) return null;
  console.log('Мокап: T-поза обрезана, движение ' + t0.toFixed(2) + '-' + t1.toFixed(2) + ' с из ' + times[n - 1].toFixed(2));
  return [t0, t1];
}

function trimClip(clip, t0, t1) {
  const tracks = clip.tracks.map((tr) => {
    const n = tr.getValueSize(), ts = [], vs = [];
    for (let i = 0; i < tr.times.length; i++) {
      if (tr.times[i] < t0 - 1e-4 || tr.times[i] > t1 + 1e-4) continue;
      ts.push(tr.times[i] - t0);
      for (let k = 0; k < n; k++) vs.push(tr.values[i * n + k]);
    }
    return new tr.constructor(tr.name, ts, vs);
  }).filter((tr) => tr.times.length);
  return new THREE.AnimationClip(clip.name, t1 - t0, tracks);
}

// Убирает рывок при повторе: последние LOOP_BLEND секунд плавно подводят позу
// к первому кадру, так что конец анимации совпадает с началом.
const LOOP_BLEND = 0.6;
function makeLoopSeamless(clip, blend) {
  const D = clip.duration;
  // если последний ключ стоит раньше конца клипа - добавляем ключ ровно в конце,
  // иначе на повторе поза прыгает на первый кадр (тело дёргается, волосы «рябят»)
  for (const track of clip.tracks) {
    const t = track.times, n = track.getValueSize();
    if (t.length && t[t.length - 1] < D - 1e-4) {
      const nt = new Float32Array(t.length + 1); nt.set(t); nt[t.length] = D;
      const nv = new Float32Array(track.values.length + n); nv.set(track.values);
      for (let k = 0; k < n; k++) nv[t.length * n + k] = track.values[t.length * n - n + k];

    const isQuat = track instanceof THREE.QuaternionKeyframeTrack;
    for (let i = 0; i < t.length; i++) {
      if (t[i] < D - blend) continue;

async function setBase(file) {
  if (!vrm || !mixer) return;
  const token = ++baseToken;
  let clip = await getClip(file);
  if (!clip && file !== STATE_ANIM.idle) clip = await getClip(STATE_ANIM.idle);
  if (!clip) clip = idleClip;
  if (token !== baseToken || clip === baseClip) return;
  baseClip = clip;
  if (LOG_ANIM) console.log('🎬 цикл: ' + file);
  crossTo(clip); // во время жеста база наберёт вес после его окончания
}

// ---------------------------------------------------------------------
// Смешивание анимаций: веса меняем сами, плавно, и всегда нормируем,
// чтобы сумма была ровно 1. Тогда нет ни рывков при быстрой смене
// состояний, ни «проваливания» в T-позу.
// ---------------------------------------------------------------------
const activeActions = new Map(); // action -> текущий вес

function startAction(a, weight) {
  if (!activeActions.has(a)) {
    a.reset();
    const d = a.getClip().duration;
    if (a.loop !== THREE.LoopOnce && d > ANIM.longClip) a.time = Math.random() * d;
    a.play();
    activeActions.set(a, weight);

}

function crossTo(clip, instant = false) {
  const a = mixer.clipAction(clip);
  startAction(a, instant ? 1 : 0);
  if (instant) for (const k of activeActions.keys()) activeActions.set(k, k === a ? 1 : 0);
  baseAction = a;
}

let fadeOverride = 0;   // особые плавные переходы (сон: сидит -> ложится)
function updateBlend(dt) {
  if (baseAction && !activeActions.has(baseAction)) startAction(baseAction, 0);
  if (!activeActions.size) return;
  const target = shotAction || baseAction;
  const time = shotAction ? 0.3 : (shotJustEnded ? SHOT_RETURN : (fadeOverride || FADE));
  const step = dt / time;
  let sum = 0;
  for (const [a, w] of activeActions) {
    const goal = a === target ? 1 : 0;
    const nw = goal > w ? Math.min(goal, w + step) : Math.max(goal, w - step);
    activeActions.set(a, nw);
    sum += nw;
  }
  for (const [a, w] of activeActions) {
    const nw = sum > 0 ? w / sum : (a === target ? 1 : 0);
    activeActions.set(a, nw);
    if (nw <= 0.0001 && a !== target && a !== baseAction) {
      a.stop();
      activeActions.delete(a);
    } else {
      a.setEffectiveWeight(nw);
    }
  }
  if (shotJustEnded && activeActions.get(target) >= 0.999) shotJustEnded = false;
}
let shotJustEnded = false;

// Кусок жеста по SHOTS[name].from/to (кэшируется)
const shotCache = {};
async function getShotClip(name) {
  if (name in shotCache) return shotCache[name];
  const s = SHOTS[name];
  if (!s) return null;
  const full = await getClip(s.file);
  if (!full) { shotCache[name] = null; return null; }
  const FPS = 30;
  const from = Math.max(0, s.from || 0);
  const to = Math.min(full.duration, s.to || full.duration);
  shotCache[name] = (from > 0 || to < full.duration)
    ? THREE.AnimationUtils.subclip(full, 'shot_' + name, Math.round(from * FPS), Math.round(to * FPS), FPS)
    : full;
  return shotCache[name];
}

async function playShot(name) {
  if (!vrm || !mixer || shotAction) return;
  const now = performance.now() / 1000;
  if (lastShotTime[name] && now - lastShotTime[name] < (SHOT_COOLDOWN[name] || 0)) return;
  const clip = await getShotClip(name);
  if (!clip || shotAction) return;
  lastShotTime[name] = now;

  const a = mixer.clipAction(clip);
  if (activeActions.has(a)) { a.stop(); activeActions.delete(a); } // жест мог ещё затухать
  a.setLoop(THREE.LoopOnce, 1);
  a.clampWhenFinished = true;
  startAction(a, 0);
  shotAction = a;
  if (LOG_ANIM) console.log('🎬 жест: shot:' + name);
}

const gestureLast = {};
let gestureBusyUntil = 0;

async function playGesture(spec, kind = '') {
  if (!vrm || !mixer || shotAction) return false;
  const now = performance.now() / 1000;
  if (now < gestureBusyUntil) return false;
  if (spec.startsWith('shot:')) { lastShotTime[spec.slice(5)] = 0; await playShot(spec.slice(5)); shotKind = kind; return !!shotAction; }
  const clip = await getClip(spec);
  if (!clip || shotAction) return false;
  const a = mixer.clipAction(clip);
  if (activeActions.has(a)) { a.stop(); activeActions.delete(a); }
  a.setLoop(THREE.LoopOnce, 1);
  a.clampWhenFinished = true;
  startAction(a, 0);
  shotAction = a;
  shotKind = kind;
  gestureBusyUntil = now + 1.5;
  if (LOG_ANIM) console.log('🎬 жест: ' + spec);

}
// жест по просьбе: обрывает бытовой жест и играет до конца
async function commandGesture(key) {

  if (!list || !vrm || !mixer) { console.warn('Нет жеста: ' + key); return false; }
  const spec = pick(list, 'cmd_' + key);
  if (!spec) return false;
  if (shotAction) { shotAction = null; shotJustEnded = true; }   // текущий жест плавно уходит
  gestureBusyUntil = 0;
  if (spec.startsWith('shot:')) {
    const name = spec.slice(5);
    lastShotTime[name] = 0;
    await playShot(name);

    return !!shotAction;
  }

}

function pick(list, key) {
  const opts = list.filter((f) => clipCache[f] !== null);
  if (!opts.length) return null;
  let c = opts[Math.floor(Math.random() * opts.length)];
  if (opts.length > 1 && c === gestureLast[key]) c = opts[(opts.indexOf(c) + 1 + Math.floor(Math.random() * (opts.length - 1))) % opts.length];
  gestureLast[key] = c;

}
const rnd = (r) => r[0] + Math.random() * (r[1] - r[0]);

  if (VIEWER) return;
  director.state = ANIM.loops[state] ? state : 'idle';
  if (shotAction && shotKind === 'fidget') { shotAction = null; shotJustEnded = true; }
  const t = clock.elapsedTime;
  const f = pick(ANIM.loops[director.state], 'loop_' + director.state);
  if (f) setBase(f);
  director.nextLoop = t + rnd(ANIM.hold[director.state] || [15, 30]);
  const fid = ANIM.fidgets[director.state];
  director.nextFidget = fid ? t + rnd(fid.every) : Infinity;
}

function updateDirector() {
  if (VIEWER || !vrm || !mixer || WALKIN.lock) return;
  const t = clock.elapsedTime;
  if (t >= director.nextLoop && !shotAction) {
    const f = pick(ANIM.loops[director.state], 'loop_' + director.state);
    if (f) setBase(f);
    director.nextLoop = t + rnd(ANIM.hold[director.state] || [15, 30]);
  }
  const fid = ANIM.fidgets[director.state];
  if (fid && t >= director.nextFidget && !PROMO) {
    director.nextFidget = t + rnd(fid.every);
    if (!shotAction && Math.random() < fid.chance) {

function onShotFinished(e) {
  if (!shotAction || e.action !== shotAction) return;
  shotAction = null;      // жест застыл на последнем кадре и плавно уходит
  shotJustEnded = true;   // возврат в позу чуть медленнее (SHOT_RETURN)

// МИМИКА (сглаживание)
// =====================================================================

// =====================================================================
// СЛОЙ ЖИВОСТИ: моргание, взгляд, голова, дыхание, губы по слогам, тень
// Работает поверх любой анимации. Выключить что-то - поставь false.
// =====================================================================
const LIVE = {
  blink: true,        // естественное моргание (вместо таймера из avatar3d.py)
  gaze: true,         // глаза живые: смотрят на тебя / на курсор / в сторону
  head: true,         // голова немного поворачивается за взглядом
  headFollow: 0.45,   // насколько голова идёт за взглядом (0 - только глаза, 1 - вся)
  cursor: true,       // следить за курсором мыши (нужен свежий avatar3d.py)
  breath: true,       // дыхание грудью
  breathAmp: 0.012,   // сила дыхания (радианы)
  shadow: true,       // мягкая тень под ногами
  shadowOpacity: 0.32,
};

const live = {
  t: 0, blinkNext: 1.5, blinkT: -1, blinkDouble: false,
  gazeObj: new THREE.Object3D(), gazeGoal: new THREE.Vector3(), gazeCur: new THREE.Vector3(),
  sacc: new THREE.Vector2(), saccNext: 0, glanceUntil: 0, glanceOff: new THREE.Vector2(), glanceNext: 6,
  cursor: null, cursorAt: -99, cursorPrev: null,
  yaw: 0, pitch: 0, roll: 0,
  lip: { A: 0, I: 0, U: 0, E: 0, O: 0 }, vowel: 'A', blinkV: 0, lipLow: true, lipLast: 0, ampPrev: 0,
  shadow: null, spokeAt: -99, emoScale: 1,
};
scene.add(live.gazeObj);

const VOWELS = {
  A: { A: 1.0 },
  O: { O: 0.9, A: 0.15 },
  E: { E: 0.85, A: 0.2 },
  I: { I: 0.8, A: 0.2 },
  U: { U: 0.9 },
};
const VOWEL_W = [['A', 0.32], ['O', 0.2], ['E', 0.2], ['I', 0.16], ['U', 0.12]];
function randomVowel(prev) {
  for (let k = 0; k < 4; k++) {
    let r = Math.random(), v = 'A';
    for (const [n, w] of VOWEL_W) { if ((r -= w) <= 0) { v = n; break; } }
    if (v !== prev) return v;
  }
  return 'A';
}

function setupLive() {
  if (vrm.lookAt && LIVE.gaze) { vrm.lookAt.target = live.gazeObj; vrm.lookAt.autoUpdate = true; }
  camera.getWorldPosition(live.gazeCur); live.gazeGoal.copy(live.gazeCur); live.gazeObj.position.copy(live.gazeCur);
  if (LIVE.shadow) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 4, 64, 64, 64);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    const m = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false,
                                            opacity: LIVE.shadowOpacity });
    live.shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.34), m);
    live.shadow.rotation.x = -Math.PI / 2; live.shadow.renderOrder = -1;
    scene.add(live.shadow);
  }
}

// ---- моргание: случайные паузы 2-6 с, иногда двойное; быстро закрыть, чуть медленнее открыть
function updateBlink(dt) {
  if (!LIVE.blink) return;
  const t = live.t;
  if (live.blinkT < 0 && t >= live.blinkNext) live.blinkT = 0;
  let v = 0;
  if (live.blinkT >= 0) {
    live.blinkT += dt;
    const b = live.blinkT, C = 0.07, H = 0.04, O = 0.12;
    v = b < C ? b / C : b < C + H ? 1 : b < C + H + O ? 1 - (b - C - H) / O : 0;
    if (b >= C + H + O) {
      live.blinkT = -1;
      if (!live.blinkDouble && Math.random() < 0.15) { live.blinkDouble = true; live.blinkNext = t + 0.12; }
      else {
        live.blinkDouble = false;
        // когда говорит или думает - моргает чаще
        const busy = prevState === 'speaking' || prevState === 'thinking';
        live.blinkNext = t + (busy ? 1.5 : 2.2) + Math.random() * (busy ? 3 : 4.5);
      }
    }
  }
  live.blinkV = v;
}

// ---- губы: из громкости делаем слоги с разными гласными
function updateLips(dt) {
  const amp = Math.max(morphSources.MTH_A || 0, morphSources.MTH_O || 0, morphSources.MTH_E || 0,
                       morphSources.MTH_I || 0, morphSources.MTH_U || 0);
  const t = live.t;
  if (amp < 0.07) live.lipLow = true;
  const rising = amp > live.ampPrev + 0.05;
  if (amp > 0.1 && (live.lipLow || (rising && t - live.lipLast > 0.16)) && t - live.lipLast > 0.08) {
    live.vowel = randomVowel(live.vowel); live.lipLast = t; live.lipLow = false;
  }
  live.ampPrev = amp;
  const shape = VOWELS[live.vowel];
  const k = Math.min(1, dt * 22);
  const open = Math.pow(Math.min(1, amp * FACE.lipGain), 0.8);   // тихо - чуть приоткрыт, громко - сильнее
  for (const n of Object.keys(live.lip)) {
    const target = (shape[n] || 0) * open * (FACE.lips[n] || 0.5);
    live.lip[n] += (target - live.lip[n]) * k;
  }
}

// ---- точка, куда смотрит Ева
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
function headWorld(out) {
  const h = vrm.humanoid.getNormalizedBoneNode('head');
  return h ? h.getWorldPosition(out) : out.set(0, 1.4, 0);
}

  // курсор живёт «на стекле монитора» = в плоскости камеры, в масштабе Евы на экране
  const head = headWorld(_v1);
  const hp = head.clone().project(camera);
  const hx = (hp.x + 1) / 2 * innerWidth, hy = (1 - hp.y) / 2 * innerHeight;

  const camR = _v2.set(1, 0, 0).applyQuaternion(camera.quaternion), camU = _v3.set(0, 1, 0).applyQuaternion(camera.quaternion);
  out.copy(camera.position)

function updateGaze(dt) {
  if (!LIVE.gaze) return;
  const t = live.t, st = prevState;
  const camPos = camera.position;
  const head = headWorld(new THREE.Vector3());
  const goal = live.gazeGoal;
  const cursorFresh = LIVE.cursor && live.cursor && t - live.cursorAt < 2.5;

  // базовая точка: на тебя (камера на уровне её глаз)

  } else if (st === 'searching') {

  } else if (cursorFresh && (st === 'idle' || st === 'listening')) {

    // в простое иногда отводит взгляд
    if (t >= live.glanceNext) {

      live.glanceOff.set((Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.8), (Math.random() - 0.6) * 0.6);
      live.glanceNext = live.glanceUntil + 4 + Math.random() * 8;

    live.saccNext = t + 0.4 + Math.random() * 1.6;

  goal.x += live.sacc.x; goal.y += live.sacc.y;

  live.gazeCur.lerp(goal, Math.min(1, dt * 18));

}

// ---- добавки к позе поверх анимации (без накопления: если анимация кость не перезаписала,
//      сначала возвращаем её «чистую» позу)
const _addState = new Map();

function updateHeadAndBreath(dt) {
  if (VIEWER) return;                       // в просмотрщике - чистая анимация
  const t = live.t;

  const head = vrm.humanoid.getNormalizedBoneNode('head');
  const chest = vrm.humanoid.getNormalizedBoneNode('upperChest') || vrm.humanoid.getNormalizedBoneNode('chest');

function updateLive(dt) {
  live.t += dt;

  const emoGoal = live.t - live.spokeAt < 0.4 ? 1 : FACE.after;
  live.emoScale += (emoGoal - live.emoScale) * Math.min(1, dt * 4);

  emotions: {
    neutral:   {},

    fun:       { EYE_Fun: 0.45, BRW_Fun: 0.6, MTH_Fun: 0.55 },
    angry:     { EYE_Angry: 0.55, BRW_Angry: 0.85, MTH_Angry: 0.45 },
    sorrow:    { EYE_Sorrow: 0.6, BRW_Sorrow: 0.85, MTH_Sorrow: 0.45 },
    surprised: { EYE_Surprised: 0.6, BRW_Surprised: 0.9, MTH_Surprised: 0.25 },
  },
  // лицо по состоянию (лёгкое, складывается с эмоцией)
  states: {
    idle:      { MTH_Fun: 0.12 },
    listening: { BRW_Surprised: 0.25, EYE_Natural: 0.15, MTH_Fun: 0.18 },
    thinking:  { BRW_Angry: 0.35, EYE_Sorrow: 0.12, MTH_Neutral: 0.4 },
    searching: { BRW_Angry: 0.2, EYE_Natural: 0.2 },
    speaking:  {},
  },
  after: 0.6,           // эмоция после речи (доля): спокойная улыбка вместо «застывшей» радости
  speakSmile: 0.4,      // пока говорит, улыбка/гримаса рта слабее (чтобы не мешала губам)
  // губы при речи: насколько максимум открывается рот на каждой гласной (1 = как в VRoid, слишком широко)
  lips: { A: 0.8, I: 0.7, U: 0.75, E: 0.7, O: 0.8 },   // было 0.55/0.55/0.6/0.5/0.55 - губы еле шевелились
  lipGain: 1.3,         // чувствительность к громкости голоса
  smooth: 6,            // скорость смены выражения (больше = быстрее)
  micro: true,          // в простое иногда мимолётно улыбается
};

const face = { meshes: [], cur: {}, micro: 0, microNext: 8, microUntil: 0, names: new Set() };
function setupFace() {
  vrm.scene.traverse((o) => {
    if (o.morphTargetDictionary && 'Fcl_MTH_A' in o.morphTargetDictionary) face.meshes.push(o);
  });
  for (const set of [...Object.values(FACE.emotions), ...Object.values(FACE.states)]) for (const k of Object.keys(set)) face.names.add(k);
  for (const k of ['MTH_A', 'MTH_I', 'MTH_U', 'MTH_E', 'MTH_O', 'EYE_Close', 'EYE_Close_L', 'EYE_Close_R']) face.names.add(k);
  console.log('Мимика: лицо найдено (' + face.meshes.length + ' меш.), частей: ' + face.names.size);
}

function faceTargets(dt) {
  const T = {};
  const add = (set, k) => { for (const [n, v] of Object.entries(set || {})) T[n] = Math.min(1, (T[n] || 0) + v * k); };
  const speaking = prevState === 'speaking';
  add(FACE.states[prevState], 1);
  add(FACE.emotions[prevEmotion], live.emoScale);
  // мимолётная улыбка в простое
  if (FACE.micro && prevState === 'idle' && prevEmotion === 'neutral') {
    if (live.t >= face.microNext) { face.microUntil = live.t + 1.2 + Math.random(); face.microNext = face.microUntil + 10 + Math.random() * 15; }
    face.micro += ((live.t < face.microUntil ? 1 : 0) - face.micro) * Math.min(1, dt * 3);
    add({ MTH_Fun: 0.3, EYE_Fun: 0.2 }, face.micro);
  }
  // пока говорит - рот отдаём губам: улыбка/гримаса рта слабее
  if (speaking) for (const n of Object.keys(T)) if (n.startsWith('MTH_')) T[n] *= FACE.speakSmile;
  // губы
  for (const [v, w] of Object.entries(live.lip)) {
    const n = 'MTH_' + v;
    T[n] = Math.min(1, (T[n] || 0) + w);
  }
  // моргание / закрытые глаза
  eyesForced += (eyesForcedGoal - eyesForced) * Math.min(1, dt * 4);
  T.EYE_Close = Math.max(live.blinkV || 0, eyesForced);
  return T;
}

function updateFace(dt) {
  if (!face.meshes.length) return;
  const T = faceTargets(dt);
  for (const n of face.names) {
    const target = T[n] || 0, cur = face.cur[n] || 0;
    const speed = n === 'EYE_Close' ? 60 : n.startsWith('MTH_') && 'AIUEO'.includes(n.slice(4)) && n.length === 5 ? 28 : FACE.smooth;
    face.cur[n] = cur + (target - cur) * Math.min(1, speed * dt);
  }
  // VRoid: «закрыть глаза» + любая другая форма глаз (улыбка, прищур) = ресницы проваливаются в щёку.
  // Поэтому чем сильнее закрыты глаза, тем слабее остальные формы глаз.
  const open = 1 - Math.min(1, face.cur.EYE_Close || 0);
  for (const m of face.meshes) {
    const d = m.morphTargetDictionary, inf = m.morphTargetInfluences;
    for (const n of face.names) {
      const i = d['Fcl_' + n]; if (i === undefined) continue;
      inf[i] = n.startsWith('EYE_') && !n.startsWith('EYE_Close') ? face.cur[n] * open : face.cur[n];
    }
  }
}
// ---- детектор рывков: если точка тела за кадр двигается неестественно быстро - пишем в лог
const _jump = { prev: null, pts: null, frames: 0, worst: 0 };
function jumpCheck(dt) {
  if (!_jump.pts) {
    _jump.pts = [];
    for (const n of ['head', 'leftHand', 'rightHand', 'leftLowerArm', 'rightLowerArm', 'chest', 'hips']) {
      const b = vrm.humanoid.getRawBoneNode(n); if (b) _jump.pts.push([n, b]);
    }
    const sb = vrm.springBoneManager;
    if (sb) { let i = 0; for (const j of sb.joints) { if (!j.child && i++ < 6) _jump.pts.push(['волосы' + i, j.bone]); } }
  }
  const cur = _jump.pts.map(([n, b]) => b.getWorldPosition(new THREE.Vector3()));
  _jump.frames++;
  if (_jump.prev && dt > 0) {
    for (let i = 0; i < cur.length; i++) {
      const v = cur[i].distanceTo(_jump.prev[i]) / dt;          // м/с
      const lim = _jump.pts[i][0].startsWith('волосы') ? 8 : 5;
      if (v > lim) {
        const acts = [...activeActions].map(([a, w]) => a.getClip().name.split('/').pop().slice(-24) + ':' + w.toFixed(2)).join(' | ');
        console.log(`[РЫВОК] ${_jump.pts[i][0]} ${v.toFixed(1)} м/с за кадр ${(dt * 1000).toFixed(0)} мс; t=${clock.elapsedTime.toFixed(2)}; ` +
                    `состояние ${prevState}; ${acts}`);
        break;
      }
    }
  }
  _jump.prev = cur;
}

// готовые выражения VRM держим на нуле (их могли включить анимации VRMA)
function muteVrmExpressions() {
  const em = vrm.expressionManager;
  if (em) for (const e of em.expressions) e.weight = 0;

// ---- фон-картинка за Евой (команда «фон:» в сценарии): чуть размытая, с плавной сменой
const backdrop = { canvas: null, ctx: null, tex: null, from: null, to: null, t: 1, dur: 0.7 };
function backdropFrame(src, blur) {
  // картинка -> кадр размером с видео (в половину разрешения: это примерно размер самого скриншота, а смена фона не тормозит)
  const w = Math.round(STUDIO.w / 2), h = Math.round(STUDIO.h / 2);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  const k = Math.max(w / sw, h / sh) * (blur > 0 ? 1.02 : 1);       // «cover» + запас, чтобы размытие не темнило края
  const dw = sw * k, dh = sh * k;
  if (src !== stage.bgCanvas) g.filter = (blur > 0 ? `blur(${blur}px) ` : '') + 'brightness(0.88)';
  g.drawImage(src, (w - dw) / 2, (h - dh) / 2, dw, dh);
  g.filter = 'none';
  if (src !== stage.bgCanvas) {
    // мягкое затемнение по краям и снизу - Ева лучше читается на любом фоне
    const v = g.createRadialGradient(w / 2, h * 0.45, h * 0.2, w / 2, h * 0.45, h * 0.75);
    v.addColorStop(0, 'rgba(5,4,15,0)'); v.addColorStop(1, 'rgba(5,4,15,0.35)');
    g.fillStyle = v; g.fillRect(0, 0, w, h);
    const b = g.createLinearGradient(0, h * 0.6, 0, h);
    b.addColorStop(0, 'rgba(5,4,15,0)'); b.addColorStop(1, 'rgba(5,4,15,0.45)');
    g.fillStyle = b; g.fillRect(0, 0, w, h);
  }
  return c;
}
function setBackdrop(url, blur) {
  if (!STUDIO || STUDIO.bg === 'green') return;
  blur = (blur === undefined || blur === null || isNaN(blur)) ? 2 : +blur;      // 2 - чуть-чуть размыто
  const apply = (frame, photo) => {
    if (!backdrop.canvas) {
      backdrop.canvas = document.createElement('canvas');
      backdrop.canvas.width = frame.width; backdrop.canvas.height = frame.height;
      backdrop.ctx = backdrop.canvas.getContext('2d');
      backdrop.tex = new THREE.CanvasTexture(backdrop.canvas); backdrop.tex.colorSpace = THREE.SRGBColorSpace;
      // старт смены - с того, что было на экране (обычная сцена)
      backdrop.ctx.drawImage(stage.bgCanvas ? backdropFrame(stage.bgCanvas, 0) : frame, 0, 0);
      scene.background = backdrop.tex;
    }
    const snap = document.createElement('canvas'); snap.width = frame.width; snap.height = frame.height;
    snap.getContext('2d').drawImage(backdrop.canvas, 0, 0);
    backdrop.from = snap; backdrop.to = frame; backdrop.t = 0; backdrop.start = performance.now();
    if (stage.floor) stage.floor.visible = !photo;               // светящийся круг на полу - только на сцене
    console.log('🖼 фон: ' + (photo ? 'картинка, размытие ' + blur : 'обычная сцена'));
  };
  if (!url) { if (stage.bgCanvas && backdrop.canvas) apply(backdropFrame(stage.bgCanvas, 0), false); return; }
  const img = new Image();
  img.onload = () => apply(backdropFrame(img, blur), true);
  img.onerror = () => console.log('🖼 фон: не получилось открыть картинку');
  img.src = url;
}
function updateBackdrop(dt) {
  if (!backdrop.canvas || backdrop.t >= 1) return;
  backdrop.t = Math.min(1, (performance.now() - backdrop.start) / 1000 / backdrop.dur);   // по часам, а не по кадрам
  const g = backdrop.ctx;
  g.globalAlpha = 1; g.drawImage(backdrop.from, 0, 0);
  g.globalAlpha = ease(backdrop.t); g.drawImage(backdrop.to, 0, 0);
  g.globalAlpha = 1;
  backdrop.tex.needsUpdate = true;
}
function updateStage(dt) {
  updateBackdrop(dt);
  if (!stage.parts) return;
  const p = stage.parts.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let y = p.getY(i) + dt * (0.04 + (i % 7) * 0.008);
    if (y > 2.5) y = 0;
    p.setY(i, y); p.setX(i, p.getX(i) + Math.sin(live.t * 0.5 + i) * dt * 0.01);
  }
  p.needsUpdate = true;
}

// ---- кинокамера: планы и плавные переезды
const cine = { preset: 'full', from: null, t: 0, dur: 0, orbitT: -1, orbitDur: 0, orbitDeg: 360,
               pos: new THREE.Vector3(), target: new THREE.Vector3(), fov: 30, inited: false };
function cinePose(name) {
  const hb = (n) => vrm.humanoid.getNormalizedBoneNode(n).getWorldPosition(new THREE.Vector3());
  const head = hb('head'), hips = hb('hips'), chest = hb('chest');
  const H = head.y + 0.12;                           // рост
  const fwd = new THREE.Vector3(0, 0, 1);
  const P = (target, dist, up = 0, fov = 30) => ({ target, pos: target.clone().addScaledVector(fwd, dist).add(new THREE.Vector3(0, up, 0)), fov });
  const fitDist = (h, fov) => (h / 2) / Math.tan(THREE.MathUtils.degToRad(fov / 2));
  // ширина кадра в метрах (видео вертикальное, поэтому важна именно ширина) -> расстояние камеры
  const aspect = STUDIO.w / STUDIO.h;
  const byW = (w, fov) => (w / 2) / (Math.tan(THREE.MathUtils.degToRad(fov / 2)) * aspect);
  // крупные планы держат ЛИЦО: точка между глаз и направление взгляда головы (наклонилась - камера за ней)
  const faceShot = (w, fov, dy) => {
    const le = vrm.humanoid.getNormalizedBoneNode('leftEye'), re = vrm.humanoid.getNormalizedBoneNode('rightEye');
    let mid = head.clone().add(new THREE.Vector3(0, 0.06, 0.03)), dir = fwd.clone();
    if (le && re) {
      const a = le.getWorldPosition(new THREE.Vector3()), b = re.getWorldPosition(new THREE.Vector3());
      mid = a.clone().add(b).multiplyScalar(0.5);
      const f = mid.clone().sub(head); f.y = 0;                    // куда повёрнуто лицо (по горизонтали)
      if (f.lengthSq() > 1e-6) { f.normalize(); if (f.z < 0) f.negate(); dir = fwd.clone().lerp(f, 0.5).normalize(); }
    }
    const t = mid.add(new THREE.Vector3(0, dy, 0));
    return { target: t, pos: t.clone().addScaledVector(dir, byW(w, fov)), fov };
  };
  switch (name) {
    case 'eyes':  return faceShot(0.34, 20, 0.0);
    case 'face':  return faceShot(0.5, 26, -0.04);
    case 'bust':  return P(chest.clone().add(new THREE.Vector3(0, 0.16, 0)), byW(0.62, 30), 0.03, 30);
    case 'waist': return P(new THREE.Vector3(hips.x, hips.y + 0.38, hips.z), byW(0.85, 30), 0.05, 30);
    case 'low':   { const t = new THREE.Vector3(hips.x, H * 0.58, hips.z); const d = fitDist(H * 1.45, 34);
                    return { target: t, pos: new THREE.Vector3(t.x, 0.35, t.z + d), fov: 34 }; }
    default:      { const t = new THREE.Vector3(hips.x, H * 0.55, hips.z); return P(t, fitDist(H * 1.22, 30), 0.05, 30); }
  }
}
// «умная камера»: если руки/голова уходят за край кадра - плавно отъезжает, потом возвращается
const FIT_BONES = ['leftHand', 'rightHand', 'head', 'leftLowerArm', 'rightLowerArm'];
const fit = { zoom: 1, goal: 1, hold: 0 };
function fitNeed() {
  let m = 0; const v = new THREE.Vector3(), el = new THREE.Vector3();
  for (const b of FIT_BONES) {
    const n = vrm.humanoid.getNormalizedBoneNode(b); if (!n) continue;
    n.getWorldPosition(v); if (b === 'head') v.y += 0.14;   // макушка
    if (b === 'leftHand' || b === 'rightHand') {          // кончики пальцев: продолжаем линию предплечья
      const fa = vrm.humanoid.getNormalizedBoneNode(b === 'leftHand' ? 'leftLowerArm' : 'rightLowerArm');
      if (fa) { fa.getWorldPosition(el); v.addScaledVector(v.clone().sub(el).normalize(), 0.2); }
    }
    v.project(camera);
    if (v.y < -1) continue;                            // ниже кадра (опущенные руки) - не важно
    m = Math.max(m, v.y, Math.abs(v.x));               // важны только верх и бока
  }
  return m / 0.9;                                      // кончики пальцев - внутри 90% кадра
}
function updateFit(dt) {
  // отъезд только на общих планах и не во время переезда камеры (иначе на переезде с крупного плана
  // руки «вне кадра» и камера улетает далеко). На крупных планах руки за кадром - это нормально.
  const moving = cine.from && cine.dur > 0 && cine.t < cine.dur;
  if (!['full', 'waist', 'low'].includes(cine.preset) || moving) { fit.goal = 1; fit.hold = 0; }
  else {
    const need = fitNeed() * fit.zoom;                 // во сколько раз нужно отъехать
    if (need > fit.goal) { fit.goal = Math.min(cine.preset === 'waist' ? 1.9 : 1.5, need * 1.04); fit.hold = 1.2; }
    else if ((fit.hold -= dt) < 0) fit.goal += (Math.max(1, need) - fit.goal) * Math.min(1, dt * 1.5);
  }
  const rate = fit.goal > fit.zoom ? 7 : 2;          // отъезд быстрый, возврат мягкий
  fit.zoom += (fit.goal - fit.zoom) * Math.min(1, dt * rate);
}
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function setCamera(cmd) {
  if (!STUDIO) return;
  const [name, a1, a2] = String(cmd).trim().toLowerCase().split(/\s+/);
  const dur = parseFloat(a1 || '0') || 0;
  if (name === 'orbit' || name === 'облёт' || name === 'облет') {
    cine.orbitT = 0; cine.orbitDur = dur || 6; cine.orbitDeg = parseFloat(a2 || '360') || 360;
    console.log('🎥 облёт ' + cine.orbitDur + ' с'); return;
  }
  const map = { 'глаза': 'eyes', 'лицо': 'face', 'грудь': 'bust', 'по_пояс': 'waist', 'пояс': 'waist',
                'рост': 'full', 'в_рост': 'full', 'снизу': 'low', 'герой': 'low' };
  cine.from = { pos: cine.pos.clone(), target: cine.target.clone(), fov: cine.fov };
  cine.preset = map[name] || name; cine.t = 0; cine.dur = dur;
  const g = vrm ? cinePose(cine.preset) : null;
  console.log('🎥 камера: ' + cine.preset + (dur ? ' за ' + dur + ' с' : ' (склейка)') +
              (g ? ', до лица ' + g.pos.distanceTo(g.target).toFixed(2) + ' м' : ''));
}
function updateCine(dt) {
  if (!STUDIO || !vrm) return;
  const goal = cinePose(cine.preset);
  if (!cine.inited) { cine.pos.copy(goal.pos); cine.target.copy(goal.target); cine.fov = goal.fov; cine.inited = true; }
  if (cine.from && cine.dur > 0 && cine.t < cine.dur) {
    cine.t += dt; const e = ease(Math.min(1, cine.t / cine.dur));
    cine.pos.lerpVectors(cine.from.pos, goal.pos, e); cine.target.lerpVectors(cine.from.target, goal.target, e);
    cine.fov = cine.from.fov + (goal.fov - cine.from.fov) * e;
  } else {
    const k = cine.from && cine.dur === 0 && cine.t === 0 ? 1 : Math.min(1, dt * 3);   // склейка - сразу
    cine.pos.lerp(goal.pos, k); cine.target.lerp(goal.target, k); cine.fov += (goal.fov - cine.fov) * k;
    cine.t = Math.max(cine.t, 1e-6);
  }
  updateFit(dt);
  const pos = cine.target.clone().add(cine.pos.clone().sub(cine.target).multiplyScalar(fit.zoom));
  if (cine.orbitT >= 0) {                            // облёт вокруг Евы
    cine.orbitT += dt; const e = ease(Math.min(1, cine.orbitT / cine.orbitDur));
    const off = pos.clone().sub(cine.target).applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(cine.orbitDeg) * e);
    pos.copy(cine.target).add(off);
    if (cine.orbitT >= cine.orbitDur) cine.orbitT = -1;
  }
  const t = live.t;                                   // лёгкая «ручная» камера - живее
  pos.x += Math.sin(t * 0.7) * 0.004; pos.y += Math.sin(t * 0.9 + 1) * 0.003;
  camera.position.copy(pos);
  camera.fov = cine.fov; camera.updateProjectionMatrix();
  camera.lookAt(cine.target.x + Math.sin(t * 0.5) * 0.002, cine.target.y, cine.target.z);
}

// ---- запись видео прямо из картинки (высокое качество, без OBS)
const recorder = { rec: null, chunks: [], name: 'take' };
function recStart(name) {
  if (!STUDIO) return;
  if (recorder.rec && recorder.rec.state !== 'inactive') recorder.rec.stop();
  const stream = renderer.domElement.captureStream(STUDIO.fps);
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  recorder.name = name || ('take_' + Date.now());
  recorder.chunks = [];
  const r = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 40e6 });
  r.ondataavailable = (e) => { if (e.data && e.data.size) recorder.chunks.push(e.data); };
  r.onstop = () => {
    const blob = new Blob(recorder.chunks, { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = recorder.name + '.webm';
    document.body.appendChild(a); a.click(); a.remove();
    console.log('[REC] готово: ' + recorder.name + '.webm, ' + (blob.size / 1e6).toFixed(1) + ' МБ');
  };
  r.start(1000);
  recorder.rec = r;
  console.log('[REC] запись началась (' + mime + ')');
}
function recStop() { if (recorder.rec && recorder.rec.state !== 'inactive') recorder.rec.stop(); }

// ---- глаза по сценарию (закрыты / открыты) - для эффектного начала
let eyesForced = 0, eyesForcedGoal = 0;

// =====================================================================
// API ДЛЯ PYTHON
// =====================================================================
function exposeApi() {
  window.setMorph = (name, value) => {
    // от Python берём только громкость речи (MTH_*). Брови/глаза/эмоции мимика решает сама
    if (!name.startsWith('MTH_')) return;
    morphSources[name] = Number(value) || 0;
  };
  // курсор мыши в пикселях относительно окна аватара (шлёт avatar3d.py)
  window.setCursor = (x, y) => {
    const p = live.cursorPrev;
    if (!p || Math.abs(p.x - x) + Math.abs(p.y - y) > 3) live.cursorAt = live.t;
    live.cursor = { x, y }; live.cursorPrev = { x, y };
  };
  window.resetMorphs = () => { for (const k of Object.keys(morphSources)) morphSources[k] = 0; };

  const emoLast = {};
  window.setEmotion = (emo) => {
    if (emo === prevEmotion) return;
    prevEmotion = emo;
    const pool = PROMO ? null : ANIM.emotion[emo];
    const now = performance.now() / 1000;
    if (!pool || (emoLast[emo] && now - emoLast[emo] < ANIM.emotionCooldown)) return;
    const g = pick(pool, 'emo_' + emo);
    if (g) { emoLast[emo] = now; playGesture(g); }
  };

  window.setState = (state) => {
    if (DEBUG_FRAMES) console.log('[состояние] ' + prevState + ' -> ' + state);
    if (SLEEP.state !== 'awake') {                            // спала - к ней обратились: сначала встаёт
      SLEEP.pendingState = state; prevState = state;
      if (state !== 'idle') window.sleepEnd();
      return;
    }
    const was = prevState;
    prevState = state;
    // из режима ожидания сразу в речь = ответ на «Ева» или прощание -> приветственный жест
    if (was === 'idle' && state === 'speaking' && !PROMO) {
      const g = pick(ANIM.greeting, 'greeting');
      if (g && !(lastShotTime.__greet && performance.now() / 1000 - lastShotTime.__greet < 6)) {
        lastShotTime.__greet = performance.now() / 1000;
        playGesture(g);
      }
    }
    if (state !== was || !baseAction) directorEnter(state);
  };

  window.playVRMA = (file) => { setBase(file); };
  window.playShot = (name) => { lastShotTime[name] = 0; playShot(name); }; // для теста из консоли
  window.playGesture = (spec) => playGesture(spec);
  window.doGesture = (key) => { if (SLEEP.state === 'awake') commandGesture(String(key || '').trim()); };
  // пульт: сыграть любую анимацию по пути относительно vrma/ (обрывает текущий жест)
  window.playAnim = (spec) => {
    if (SLEEP.state !== 'awake' || !spec) return;
    if (shotAction) { shotAction = null; shotJustEnded = true; }
    gestureBusyUntil = 0;
    playGesture(String(spec), 'command').then((ok) => { if (!ok) console.warn('Не сыграла: ' + spec); });
  };
  window.setPromo = (on) => { PROMO = !!on; console.log('Режим съёмки: ' + (PROMO ? 'ВКЛ' : 'выкл')); };
  window.setCamera = (cmd) => setCamera(cmd);
  window.recStart = (name) => recStart(name);
  window.recStop = () => recStop();
  window.setEyes = (closed) => { eyesForcedGoal = closed ? 1 : 0; };
  window.setBackdrop = (url, blur) => setBackdrop(url, blur);
}
