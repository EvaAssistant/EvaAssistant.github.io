// =====================================================================
// ПОЯВЛЕНИЕ: голограмма из шара панели (окно двигает Python, эффект - здесь)
// =====================================================================
const HOLO = { on: false, t: 0, t1: 1.3, t2: 1.9, t3: 0.8, s0: 0.35, rt: null, scene: null, cam: null, mat: null };
if (INTRO) renderer.domElement.style.opacity = '0';
if (INTRO) setTimeout(() => { if (!HOLO.on && renderer.domElement.style.opacity === '0') renderer.domElement.style.opacity = '1'; }, 30000);
function holoSetup() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  HOLO.rt = new THREE.WebGLRenderTarget(size.x, size.y, { samples: 4 });
  HOLO.cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  HOLO.mat = new THREE.ShaderMaterial({
    transparent: true, blending: THREE.NoBlending, depthTest: false, depthWrite: false,
    uniforms: { tex: { value: HOLO.rt.texture }, uP: { value: 0 }, uH: { value: 1 }, uFlash: { value: 0 }, uTime: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
    fragmentShader: `
      varying vec2 vUv; uniform sampler2D tex; uniform float uP, uH, uFlash, uTime;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
        return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y); }
      vec3 toSRGB(vec3 c){ c = max(c, 0.); return mix(c * 12.92, 1.055 * pow(c, vec3(1. / 2.4)) - .055, step(.0031308, c)); }
      void main(){
        vec2 uv = vUv;
        float band = floor(uv.y * 70. + floor(uTime * 11.));
        float g = step(.94, hash(vec2(band, floor(uTime * 18.)))) * uH;          // глитч-полосы
        uv.x += (hash(vec2(band, 7.)) - .5) * .05 * g;
        vec4 c = texture2D(tex, uv);
        vec4 cr = texture2D(tex, uv + vec2(.004 * uH, 0.));                       // цветовой сдвиг (как у плохого проектора)
        vec4 cb = texture2D(tex, uv - vec2(.004 * uH, 0.));
        float a = max(c.a, max(cr.a, cb.a) * uH * .6);
        vec3 col = a > .001 ? vec3(cr.r, c.g, cb.b) / max(c.a, .001) : vec3(0.);
        col = toSRGB(min(col, vec3(1.)));
        // проявление снизу вверх по «шуму» - как сборка из света
        float n = noise(uv * vec2(24., 48.) + uTime * .7) * .6 + noise(uv * vec2(110., 220.)) * .4;
        float front = uP * 1.3 - .15;
        float d = front - (uv.y + (n - .5) * .18);
        float vis = smoothstep(0., .02, d);
        float edge = (1. - smoothstep(0., .06, d)) * step(-.02, d);
        float lum = dot(col, vec3(.299, .587, .114));
        vec3 holo = mix(vec3(.30, .82, 1.), vec3(1., .45, .92), smoothstep(.2, .9, uv.y)) * (.45 + lum * 1.5);
        float scan = .74 + .26 * sin(gl_FragCoord.y * 1.4 - uTime * 16.);
        holo *= scan;
        col = mix(col, holo, uH);
        col += edge * uH * vec3(.7, .97, 1.) * 1.8;
        col += uFlash * vec3(.8, .9, 1.);
        float flick = 1. - uH * (.10 + .16 * hash(vec2(floor(uTime * 26.), 3.)));
        float alpha = a * vis * flick * mix(1., .8, uH);
        alpha = max(alpha, edge * a * uH);
        // искры у фронта сборки - и вокруг силуэта
        float sp = step(.988, hash(floor(gl_FragCoord.xy / 3.) + floor(uTime * 9.)));
        sp *= (1. - smoothstep(0., .1, abs(d))) * uH * step(.001, texture2D(tex, uv + vec2(0., .03)).a + a);
        col = mix(col, vec3(.8, .97, 1.), sp); alpha = max(alpha, sp * .9);
        gl_FragColor = vec4(col * alpha, alpha);
      }`,
  });
  HOLO.scene = new THREE.Scene();
  HOLO.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), HOLO.mat));
}
const easeIO = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// где у Евы ноги и макушка (в пикселях окна) - Python ставит окно так, чтобы она стояла в шаре
window.feetPx = () => {
  if (!vrm) return null;
  const v = vrm.scene.position.clone().project(camera);
  const head = vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3());
  head.y += 0.12; head.project(camera);
  return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight, (1 - head.y) / 2 * innerHeight];
};
window.entrance = (type, opt) => {
  opt = opt || {};
  HOLO.t1 = opt.t1 ?? 1.3; HOLO.t2 = opt.t2 ?? 1.9; HOLO.t3 = opt.t3 ?? 0.8; HOLO.s0 = opt.s0 ?? 1;
  if (!HOLO.rt) holoSetup();
  HOLO.on = true; HOLO.t = 0;
  const f = window.feetPx() || [innerWidth / 2, innerHeight];
  const cv = renderer.domElement;
  cv.style.transformOrigin = `${f[0]}px ${f[1]}px`;
  cv.style.transform = `scale(${HOLO.s0})`;
  cv.style.opacity = '1';
  HOLO.filter0 = cv.style.filter || '';
  console.log('[ВХОД] ' + type);
  return true;
};
function holoTick(dt) {
  HOLO.t += dt;
  const { t, t1, t2, t3 } = HOLO, cv = renderer.domElement;
  let p = 1, h = 1, s = 1, flash = 0;
  if (t < t1) { p = easeIO(t / t1) * .92 + .08; s = HOLO.s0; }
  else if (t < t1 + t2) { const k = easeIO((t - t1) / t2); s = HOLO.s0 + (1 - HOLO.s0) * k; }
  else if (t < t1 + t2 + t3) { const k = (t - t1 - t2) / t3; h = 1 - easeIO(k); flash = Math.max(0, .55 - k * 1.6); }
  else { HOLO.on = false; cv.style.transform = ''; cv.style.filter = HOLO.filter0; console.log('[ВХОД] готово'); return; }
  cv.style.transform = s < 0.999 ? `scale(${s.toFixed(4)})` : '';
  const glow = (h * 14 + flash * 30).toFixed(1);                  // ореол голограммы
  cv.style.filter = HOLO.filter0 + ` drop-shadow(0 0 ${glow}px rgba(90,200,255,${(.55 * h + flash).toFixed(2)}))`;
  const u = HOLO.mat.uniforms;
  u.uP.value = p; u.uH.value = h; u.uFlash.value = flash; u.uTime.value = clock.elapsedTime;
}

// =====================================================================
// ВХОД ПЕШКОМ: из панели Ева спрыгивает вниз и идёт в свой угол (окно двигает Python)
// =====================================================================
const WALKIN = { lock: false, yaw: 0, yawGoal: 0, info: null, jump: null, walk: null, loading: false };
const INTRO_FILES = { jump: 'anim/new/Jumping Down.fbx', walk: 'anim/new/Female Walk.fbx' };
function hipsTrack(clip) {
  const name = vrm.humanoid.getNormalizedBoneNode('hips').name + '.position';
  return clip.tracks.find((t) => t.name === name);
}
async function introLoad() {
  if (WALKIN.loading || WALKIN.info) return;
  WALKIN.loading = true;
  const info = { jump: null, walk: null };
  try {                                                   // ходьба: скорость шага (м/с) - чтобы окно ехало без «скольжения»
    const url = VRMA_FOLDER + INTRO_FILES.walk.split('/').map(encodeURIComponent).join('/');
    const c = await loadMixamoClip(url, { full: true });
    const tr = hipsTrack(c);
    if (tr) {
      const it = tr.createInterpolant(), D = c.duration, t1 = Math.max(0.2, D - LOOP_BLEND);
      const a = it.evaluate(0).slice(), b = it.evaluate(t1).slice();
      info.walk = { speed: Math.max(0.6, Math.min(2.2, Math.hypot(b[0] - a[0], b[2] - a[2]) / t1)) };
    } else info.walk = { speed: 1.2 };
    WALKIN.walk = lockInPlace(c);
  } catch (e) { console.warn('Ходьба не загрузилась: ' + e); }
  try {                                                   // прыжок вниз: убираем «падение» бёдер - вниз поедет само окно
    const url = VRMA_FOLDER + INTRO_FILES.jump.split('/').map(encodeURIComponent).join('/');
    const c = await loadMixamoClip(url, { once: true, full: true });
    const tr = hipsTrack(c);
    if (tr) {
      const it = tr.createInterpolant(), D = c.duration, N = Math.ceil(D * 30);
      const Y = []; for (let i = 0; i <= N; i++) Y.push(it.evaluate(Math.min(D, i / 30))[1]);
      const ys = Y[0], ye = Y[N], drop = ys - ye;
      let take = 0, land = D;
      if (drop > 0.15) {
        let iLand = Y.findIndex((y) => y <= ye + 0.04);
        if (iLand < 0) iLand = N;
        let iTake = iLand; while (iTake > 0 && Y[iTake] < ys - 0.12 * drop) iTake--;
        take = iTake / 30; land = Math.max(take + 0.1, iLand / 30);
      }
      const fall = (t) => drop <= 0.15 ? 0 : t <= take ? 0 : t >= land ? 1 : Math.pow((t - take) / (land - take), 2);
      const v = tr.values;
      for (let i = 0; i < tr.times.length; i++) v[i * 3 + 1] += drop > 0.15 ? drop * fall(tr.times[i]) : 0;
      // без подготовки (она выглядит как перелезание через стенку): начинаем почти сразу с отрыва
      const skip = Math.max(0, take - 0.2);
      info.jump = { dur: D - skip, take: take - skip, land: land - skip, drop, skip };
    }
    WALKIN.jump = lockInPlace(c);
  } catch (e) { console.warn('Прыжок не загрузился: ' + e); }
  WALKIN.info = info;
  console.log('[ВХОД] пешком: ' + JSON.stringify(info));
}
// сколько пикселей окна в одном метре (по росту Евы) - для скорости шага
function pxPerMeter() {
  const f = window.feetPx(); if (!f) return 300;
  const head = vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3());
  return Math.max(50, (f[1] - f[2]) / (head.y + 0.12));
}
window.introInfo = () => {
  if (!vrm) return null;
  if (!WALKIN.info) { introLoad(); return null; }
  const i = WALKIN.info;
  return { jump: i.jump, speed: i.walk ? i.walk.speed : 1.17, walkPx: i.walk ? i.walk.speed * pxPerMeter() : 0, hasWalk: !!WALKIN.walk, hasJump: !!WALKIN.jump };
};
window.introStep = (step, arg) => {
  if (!vrm || !mixer) return;
  if (step === 'begin') { WALKIN.lock = true; return; }
  if (step === 'face') { WALKIN.yawGoal = (+arg || 0) * Math.PI / 2; return; }
  if (step === 'jump' && WALKIN.jump) {
    const a = mixer.clipAction(WALKIN.jump);

// =====================================================================
// ПОЯВЛЕНИЯ (окно стоит, движется Ева). Python ставит окно у главного окна Евы:

const ENTR = { on: false, type: '', phase: '', t: 0, state: 'idle', x: 0, y: 0, vy: 0, clips: {}, pending: null, cut: null };

// точка в плоскости Евы (z = 0) по координатам экрана (-1..1)

}

  WALKIN.lock = true;

      const v = ((WALKIN.info && WALKIN.info.walk && WALKIN.info.walk.speed) || 1.17) * 0.9;
      ENTR.x = Math.min(PORTAL.home, ENTR.x + v * dt); vrm.scene.position.x = ENTR.x;

// =====================================================================
// СОН: 10 минут без общения - Ева ложится и спит; обратился - просыпается

const SLEEP = { state: 'awake', t: 0, clips: {}, pendingState: null };
async function sleepLoad() {
  const files = { sit: ['anim/new/Standing Up.fbx', { full: true, abs: true, once: true }],     // встаёт из положения сидя
                  lie: ['anim/new/Laying Idle.fbx', { full: true, abs: true }] };              // лежит на спине
  for (const [k, [f, opt]] of Object.entries(files)) {
    if (SLEEP.clips[k]) continue;
    try { SLEEP.clips[k] = lockInPlace(await loadMixamoClip(VRMA_FOLDER + f.split('/').map(encodeURIComponent).join('/'), opt)); }
    catch (e) { console.warn('[СОН] не загрузилось ' + f + ': ' + e); }

}
const SIT_STAND = 4.2;     // в «Standing Up» к 4.2 с Ева уже стоит
window.sleepState = () => SLEEP.state;
window.sleepStart = async () => {
  if (SLEEP.state !== 'awake' || ENTR.on || PORTAL.on || !vrm || !mixer) return false;

  WALKIN.lock = true; WALKIN.yawGoal = Math.PI / 2;            // ложится боком - так её хорошо видно
  fadeOverride = 0.8;
  entrPlay(SLEEP.clips.sit, { once: true, speed: -0.9, from: SIT_STAND });   // садится (то же «встаёт», задом наперёд)
  SLEEP.state = 'sitting'; SLEEP.t = 0;
  console.log('[СОН] Ева засыпает');
  return true;
};
window.sleepEnd = () => {
  if (SLEEP.state === 'awake' || SLEEP.state === 'waking' || SLEEP.state === 'rising') return;
  window.setEyes && window.setEyes(false);
  fadeOverride = 1.1;
  const a = entrPlay(SLEEP.clips.sit, { once: true, from: 0 });          // приподнимается и садится
  a.timeScale = 0;
  SLEEP.state = 'waking'; SLEEP.t = 0;
  console.log('[СОН] Ева просыпается');
};
function sleepTick(dt) {
  if (SLEEP.state === 'awake') return;
  SLEEP.t += dt;
  const sit = SLEEP.clips.sit && mixer.clipAction(SLEEP.clips.sit);
  if (SLEEP.state === 'sitting' && sit && (sit.time <= 0.05 || SLEEP.t > 6)) {
    fadeOverride = 1.4;                                        // плавно откидывается на спину
    entrPlay(SLEEP.clips.lie, { speed: 0.6 });
    SLEEP.state = 'lying'; SLEEP.t = 0;
  } else if (SLEEP.state === 'lying' && SLEEP.t > 1.5) {
    window.setEyes && window.setEyes(true);

  } else if (SLEEP.state === 'waking' && SLEEP.t > 1.1) {

    SLEEP.state = 'rising'; SLEEP.t = 0;

    if (sit.time > 2.8) WALKIN.yawGoal = 0;                     // уже на ногах - поворачивается к тебе

        float n = fbm(sp * 3.3 + vec2(0., -uTime * .7));
        float arms = .5 + .5 * sin(a * 3. + log(max(rr, .03)) * 7. - uTime * 5.);
        vec3 deep = vec3(.02, .30, .06), mid = vec3(.20, .82, .16), lime = vec3(.74, 1., .30), core = vec3(.93, 1., .74);
        vec3 col = mix(deep, mid, smoothstep(.28, .72, n));
        col = mix(col, lime, smoothstep(.55, .98, n * .75 + arms * .42));
        col = mix(col, core, exp(-rr * rr * 6.) * .8);
        float inside = 1. - smoothstep(.96, 1., rr);
        float rim = exp(-pow((rr - 1.) * 15., 2.));
        col = col * inside + rim * vec3(.70, 1., .38) * 1.25;
        float glow = (1. - inside) * exp(-(rr - 1.) * 6.5) * .6;
        float alpha = max(inside * .95, min(1., rim * 1.2));
        vec3 outc = min(col, vec3(1.)) * alpha + vec3(.30, 1., .22) * glow * (1. - alpha);
        float spark = step(.982, hash(floor(vec2(a * 9. + uTime * 2., rr * 26. - uTime * 9.)))) * smoothstep(1.6, 1.05, rr) * step(1., rr);
        outc += spark * vec3(.75, 1., .55);
        alpha = max(alpha, max(glow, spark * .9));
        float fl = uFlash * exp(-rr * rr * 1.5);
        outc += fl * vec3(.6, 1., .5); alpha = max(alpha, fl);
        return vec4(min(outc, vec3(1.)), min(alpha, 1.));
      }
      void main(){
        vec2 fc = gl_FragCoord.xy;
        vec4 c = texture2D(tex, vUv);
        float dx = (fc.x - uCut) * uSide;                                     // > 0 - уже «за» порталом
        float vis = 1. - uCutOn * smoothstep(-1.5 * uDpr, 1.5 * uDpr, dx);
        vec3 eva = c.a > .001 ? toSRGB(min(c.rgb / c.a, vec3(1.))) : vec3(0.);
        float ea = c.a * vis;
        float seam = uSeam * uCutOn * step(.02, c.a) * (1. - smoothstep(0., 7. * uDpr, abs(dx)));   // светящийся срез
        vec4 E = vec4(eva * ea + vec3(.55, 1., .4) * seam * (1. - ea * .5), max(ea, seam * .9));
        vec4 P = portal(fc);
        // у краёв окна свечение плавно гаснет - иначе видна прямая граница прозрачного окна
        float edgeD = min(min(fc.x, fc.y), min(uRes.x - fc.x, uRes.y - fc.y));
        P *= smoothstep(0., 36. * uDpr, edgeD);
        vec4 o = E + P * (1. - E.a);
        if (uShot.w > 0.) {                                                    // летящий заряд
          float dd = length(fc - uShot.xy) / max(uShot.z, 1.);
          float b = exp(-dd * dd * 1.6) * uShot.w;
          o.rgb = o.rgb * (1. - b) + vec3(.80, 1., .55) * b; o.a = max(o.a, b);
        }
        gl_FragColor = vec4(min(o.rgb, vec3(1.)), min(o.a, 1.));
      }`,
  });
  PORTAL.scene = new THREE.Scene();
  PORTAL.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), PORTAL.mat));
}

// мировые координаты -> пиксели буфера (y снизу, как gl_FragCoord)
function toFrag(v3) {
  const v = v3.clone().project(camera), dpr = renderer.getPixelRatio();
  return [(v.x + 1) / 2 * innerWidth * dpr, (v.y + 1) / 2 * innerHeight * dpr];
}
let _tall = null;
function portalGeom() {
  const dpr = renderer.getPixelRatio();
  if (_tall === null) {                                                  // рост Евы, м (меряем один раз, стоя)
    const head = vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3());
    _tall = (head.y - vrm.scene.position.y) + 0.12;
  }
  const h = _tall * PCFG.hFactor;
  const bottom = toFrag(new THREE.Vector3(PORTAL.px, vrm.scene.position.y, 0));
  const top = toFrag(new THREE.Vector3(PORTAL.px, vrm.scene.position.y + h, 0));
  const ph = top[1] - bottom[1];
  const u = PORTAL.mat.uniforms;
  u.uP.value.set(bottom[0], bottom[1] + ph * 0.53, ph);   // чуть над полом - низ свечения не упирается в край окна
  u.uCut.value = bottom[0]; u.uDpr.value = dpr; u.uSide.value = PCFG.side;
  u.uRes.value.set(innerWidth * dpr, innerHeight * dpr);
}
const easeOutBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeInBack = (x) => { const c1 = 1.6; return (c1 + 1) * x * x * x - c1 * x * x; };

function portalBegin(mode) {
  if (!vrm || !mixer) return false;
  if (SLEEP.state !== 'awake') {                    // спит - сначала встаёт, потом уходит
    if (SLEEP.state !== 'waking' && SLEEP.state !== 'rising') window.sleepEnd();
    PORTAL.pending = mode; return true;
  }
  if (!PORTAL.mat) portalSetup();
  if (!PORTAL.gun) loadGun();
  if (PORTAL.home === null) PORTAL.home = vrm.scene.position.x;
  PORTAL.px = PORTAL.home + PCFG.side * PCFG.dist;
  if (!WALKIN.info) { introLoad(); PORTAL.pending = mode; return true; }   // сначала загрузим ходьбу
  PORTAL.pending = null;
  PORTAL.on = true; PORTAL.state = mode; PORTAL.t = 0; PORTAL.open = 0; PORTAL.flash = 0; PORTAL.shot = null; PORTAL.pose = 0;
  WALKIN.lock = true;
  if (WALKIN.base === undefined) WALKIN.base = vrm.scene.rotation.y;
  if (mode === 'in') {
    PORTAL.x = PORTAL.px + PCFG.side * 0.45;                               // ещё «по ту сторону»
    vrm.scene.position.x = PORTAL.x;
    WALKIN.yaw = WALKIN.yawGoal = -PCFG.side * Math.PI / 2;                // лицом туда, куда пойдёт
    vrm.scene.rotation.y = WALKIN.base + WALKIN.yaw;
    PORTAL.cutOn = true; PORTAL.phase = 'open';
    renderer.domElement.style.opacity = '1';
    portalSound('portal_open.mp3');
  } else {
    PORTAL.x = vrm.scene.position.x;
    WALKIN.yawGoal = PCFG.side * Math.PI / 2;                             // поворачивается к будущему порталу
    PORTAL.cutOn = false; PORTAL.phase = 'turn';
  }
  console.log('[ПОРТАЛ] ' + (mode === 'in' ? 'выход из портала' : 'уход в портал'));
  return true;
}
window.portalIn = () => portalBegin('in');
window.portalOut = () => portalBegin('out');
window.portalState = () => PORTAL.pending ? 'wait' : PORTAL.state;
window.portalDebug = PORTAL; PORTAL.aim = AIM_POSE; PORTAL.gunCfg = GUN_CFG;

function walkStart() {
  if (!WALKIN.walk) return;
  if (shotAction) { shotAction = null; shotJustEnded = true; }
  const a = mixer.clipAction(WALKIN.walk); a.timeScale = PCFG.walkScale;
  baseClip = WALKIN.walk; crossTo(WALKIN.walk);
}
function walkStep(dt, goal) {
  const v = ((WALKIN.info && WALKIN.info.walk && WALKIN.info.walk.speed) || 1.17) * PCFG.walkScale;
  const dir = Math.sign(goal - PORTAL.x);
  PORTAL.x += dir * v * dt;
  const done = (goal - PORTAL.x) * dir <= 0;
  if (done) PORTAL.x = goal;
  vrm.scene.position.x = PORTAL.x;
  return done;
}
function poseTick(w) {
  if (w <= 0.001) return;
  for (const [bone, q] of Object.entries(AIM_POSE)) {
    const n = vrm.humanoid.getNormalizedBoneNode(bone);
    if (n) n.quaternion.slerp(q, w);
  }
}

function portalTick(dt) {
  if (PORTAL.pending && WALKIN.info && SLEEP.state === 'awake') portalBegin(PORTAL.pending);
  if (!PORTAL.on) return;
  PORTAL.t += dt;
  const t = PORTAL.t, ph = PORTAL.phase;
  const next = (p) => { PORTAL.phase = p; PORTAL.t = 0; };
  const g = PORTAL.gun && PORTAL.gun !== 'loading' ? PORTAL.gun : null;
  if (PORTAL.state === 'in') {                                  // --- выход из портала ---
    if (ph === 'open') {
      PORTAL.open = easeOutBack(Math.min(1, t / 0.75));
      if (t >= 0.75) { walkStart(); next('walk'); }
    } else if (ph === 'walk') {
      PORTAL.open = 1;
      const done = walkStep(dt, PORTAL.home);
      if ((PORTAL.x - PORTAL.px) * -PCFG.side > 0.45) PORTAL.cutOn = false;
      if (done) { window.introStep('end'); mixer.clipAction(WALKIN.walk).timeScale = 1; next('stay'); }
    } else if (ph === 'stay') {
      if (t >= 0.35) { next('close'); portalSound('portal_close.mp3'); }
    } else if (ph === 'close') {
      const k = Math.min(1, t / 0.5);
      PORTAL.open = Math.max(0, 1 - easeInBack(k)); PORTAL.flash = k > 0.8 ? (1 - k) * 3 : 0;
      if (k >= 1) { PORTAL.on = false; PORTAL.open = 0; PORTAL.state = 'shown'; console.log('[ПОРТАЛ] Ева на месте'); }
    }
  } else if (PORTAL.state === 'out') {                          // --- уход в портал ---
    if (ph === 'turn') {
      if (t >= 0.45) next('aim');
    } else if (ph === 'aim') {                                    // достаёт пушку и прицеливается
      PORTAL.pose = easeIO(Math.min(1, t / 0.5));
      if (g) { g.visible = true; g.scale.setScalar(Math.max(0.0001, easeOutBack(Math.min(1, t / 0.35)) * GUN_CFG.scale)); }
      if (t >= 0.75) {
        PORTAL.shot = { k: 0 };                                   // выстрел: короткая зелёная вспышка у ствола
        portalSound('portal_shot.mp3');
        portalSound('portal_open.mp3');
        next('shoot');
      }
    } else if (ph === 'shoot') {                                  // вспышка у ствола, лёгкая отдача, портал сразу раскрывается
      PORTAL.pose = 1 - 0.15 * Math.sin(Math.min(1, t / 0.18) * Math.PI);
      PORTAL.shot.k = Math.min(1, t / 0.22);
      PORTAL.open = easeOutBack(Math.min(1, t / 0.7)) * Math.min(1, t / 0.05);
      if (t >= 0.22) { PORTAL.shot = null; PORTAL.t = t; PORTAL.phase = 'open'; }
    } else if (ph === 'open') {
      PORTAL.open = easeOutBack(Math.min(1, t / 0.7));
      const k = Math.min(1, Math.max(0, t - 0.3) / 0.45);           // чуть любуется порталом, потом опускает руку
      PORTAL.pose = 1 - easeIO(k);
      if (g) g.scale.setScalar(Math.max(0.0001, (1 - k) * GUN_CFG.scale));
      if (t >= 0.8) { if (g) g.visible = false; PORTAL.pose = 0; PORTAL.cutOn = true; walkStart(); next('walk'); }
    } else if (ph === 'walk') {
      PORTAL.open = 1;
      if (walkStep(dt, PORTAL.px + PCFG.side * 0.5)) { next('close'); portalSound('portal_close.mp3'); }
    } else if (ph === 'close') {
      const k = Math.min(1, t / 0.5);
      PORTAL.open = Math.max(0, 1 - easeInBack(k)); PORTAL.flash = k > 0.8 ? (1 - k) * 3 : 0;
      if (k >= 1) {
        PORTAL.on = false; PORTAL.open = 0; PORTAL.state = 'gone';
        renderer.domElement.style.opacity = '0';
        mixer.clipAction(WALKIN.walk).timeScale = 1;
        console.log('[ПОРТАЛ] Ева ушла');
      }
    }
  }
  poseTick(PORTAL.pose);
}
// окно снова показали после ухода - вернуть Еву на место (дальше обычно сразу portalIn)
window.portalReset = () => {
  PORTAL.on = false; PORTAL.state = 'idle'; PORTAL.open = 0; PORTAL.pose = 0; PORTAL.cutOn = false; PORTAL.pending = null;
  if (PORTAL.home !== null) vrm.scene.position.x = PORTAL.home;
  window.introStep('end');
  if (WALKIN.walk) mixer.clipAction(WALKIN.walk).timeScale = 1;
  renderer.domElement.style.opacity = '1';
};
function portalRender() {
  if (!PORTAL.mat) portalSetup();
  if (PORTAL.home === null) PORTAL.home = vrm.scene.position.x;
  PORTAL.px = PORTAL.home + PCFG.side * PCFG.dist;
  portalGeom();
  const u = PORTAL.mat.uniforms;
  u.uSeam.value = 1;
  u.uOpen.value = PORTAL.open; u.uTime.value = clock.elapsedTime; u.uCutOn.value = PORTAL.cutOn ? 1 : 0; u.uFlash.value = PORTAL.flash;
  if (!PORTAL.on && ENTR.cut !== null) {                        // выходит из-за края главного окна
    u.uOpen.value = 0; u.uCutOn.value = 1; u.uSide.value = -1; u.uCut.value = ENTR.cut * renderer.getPixelRatio();
    u.uSeam.value = 0;                                          // у «стены» нет зелёного свечения
  }
  if (PORTAL.shot) {                                              // вспышка у ствола: ярко сразу, гаснет за ~0.2 с
    const g = PORTAL.gun && PORTAL.gun !== 'loading' ? PORTAL.gun : null;
    const m = g ? g.localToWorld(g.userData.muzzle.clone()) : vrm.humanoid.getNormalizedBoneNode('leftHand').getWorldPosition(new THREE.Vector3());
    const f = toFrag(m), k = PORTAL.shot.k;
    u.uShot.value.set(f[0], f[1], (7 + 6 * k) * renderer.getPixelRatio(), 1 - k * k);
  } else u.uShot.value.w = 0;
  renderer.setRenderTarget(HOLO.rt); renderer.setClearColor(0x000000, 0); renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.clear();
  renderer.render(PORTAL.scene, HOLO.cam);
}

// ОГРАНИЧЕНИЕ КАДРОВ: без него Ева рисуется с частотой монитора (на 144 Гц - 144 раза в секунду).
// Спокойно стоит - 30 кадров, говорит/слушает/появляется - 60, спит - 20. Окно свёрнуто - не рисуем.
// Для проверки можно задать вручную: адрес ?fps=60 (0 - без ограничения).
const FPS_CAP = { calm: GFX_CFG.calm, active: GFX_CFG.active, sleep: Math.min(20, GFX_CFG.calm) };
const _fpsQ = _qst.has('fps') ? +_qst.get('fps') : null;
let _lastDraw = 0;
function fpsGoal() {
  if (_fpsQ !== null) return _fpsQ;
  if (STUDIO || VIEWER) return 0;                         // студия Shorts и просмотрщик - без ограничения
  if (PORTAL.on || ENTR.on || HOLO.on) return FPS_CAP.active;
  if (SLEEP.state === 'asleep') return FPS_CAP.sleep;
  if (['sitting', 'waking', 'lying', 'rising'].includes(SLEEP.state)) return FPS_CAP.active;
  if (prevState === 'speaking' || prevState === 'listening') return FPS_CAP.active;
  return FPS_CAP.calm;
}

function animate(ts) {
  if (PAUSED) return;        // цикл остановлен; window.setPaused(false) запустит его снова
  requestAnimationFrame(animate);
  if (document.hidden && !STUDIO) return;                 // окно свёрнуто или скрыто - видеокарта отдыхает
  const goal = fpsGoal();
  if (goal > 0) {
    const now = ts || performance.now();
    if (now - _lastDraw < 1000 / goal - 1.5) return;      // ещё рано для следующего кадра
    _lastDraw = now;
  }
  const rawDt = clock.getDelta();
  if (rawDt > 0.1 && !PAUSED && clock.elapsedTime > 15) {   // много подвисаний подряд = окно рисуется плохо
    const now = clock.elapsedTime;
    _stalls.push(now);
    while (_stalls.length && now - _stalls[0] > 10) _stalls.shift();
    if (_stalls.length >= 15 && now - _stallReported > 120) {
      _stallReported = now;
      console.log('[ОКНО] кадры постоянно подвисают (' + _stalls.length + ' за 10 с) - нужен перезапуск окна');
    }
  }
  if ((DEBUG_FRAMES || JUMP_DEBUG) && rawDt > 0.07 && clock.elapsedTime > 8 && !PAUSED)
    console.log('[ЗАДЕРЖКА] кадр ' + Math.round(rawDt * 1000) + ' мс; t=' + clock.elapsedTime.toFixed(2) + '; состояние ' + prevState +
                '; ' + [...activeActions].map(([a, w]) => a.getClip().name.split('/').pop().slice(-24) + ':' + w.toFixed(2)).join(' | '));
  const dt = Math.min(rawDt, 0.1);
  if (vrm) {
    if (mixer) { updateDirector(); updateBlend(dt); mixer.update(VIEWER ? dt * viewer.speed * (viewer.paused ? 0 : 1) : dt); }
    if (VIEWER) viewerTick();
    updateWeightShift(dt);
    introTick(dt);
    updateLive(dt);
    solidBody();
    portalTick(dt);                   // портал: своя поза рук поверх анимации
    entrTick(dt);                     // случайные появления
    sleepTick(dt);                    // сон после 10 минут тишины
    muteVrmExpressions();
    if (springResetPending && baseAction) {
      // ждём, пока поза ожидания полностью проявится (fadeIn), затем ставим
      // волосы в покой от неё, а не от T-позы
      if (springResetAt === null) springResetAt = clock.elapsedTime + FADE + 0.1;
      else if (clock.elapsedTime >= springResetAt) {
        vrm.update(0);
        vrm.scene.updateMatrixWorld(true);
        if (vrm.springBoneManager && vrm.springBoneManager.reset) vrm.springBoneManager.reset();
        springResetPending = false;
        console.log('Spring Bone: сброшено в позу ожидания');
      }
    }
    vrm.update(Math.min(dt, 1 / 30));  // волосы: после подвисания не «хлещут» (без большого шага физики)
    updateFace(dt);                   // после vrm.update: VRM не перезапишет наши части лица
    if (JUMP_DEBUG) jumpCheck(dt);
    if (STUDIO) { updateCine(dt); updateStage(dt); }
    if (FACE_CAM) {                   // ?facecam=1 - камера крупно на лицо (для проверки мимики)
      const h = vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3());
      camera.position.set(h.x, h.y + 0.06, h.z + 1.0); camera.lookAt(h.x, h.y + 0.06, h.z);
    }
  }
  if (vrm && contact.ready) updateContactShadow();
  if (PORTAL.on || ENTR.cut !== null) { portalRender(); return; }
  if (HOLO.on) {
    holoTick(dt);
    if (HOLO.on) {
      renderer.setRenderTarget(HOLO.rt); renderer.setClearColor(0x000000, 0); renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(null); renderer.clear();
      renderer.render(HOLO.scene, HOLO.cam);
      return;
    }
  }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  if (STUDIO) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (vrm && !VIEWER) setupCamera();
});
</script>
